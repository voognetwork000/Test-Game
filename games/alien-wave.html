<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alien Wave</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>.board { max-width: 480px; }</style>
</head>
<body>
<header class="top">
  <a class="back" href="../index.html">← Library</a>
  <h1>Alien Wave</h1>
  <div class="stats">
    <div class="stat"><small>Score</small><b id="score">0</b></div>
    <div class="stat"><small>Lives</small><b id="lives">3</b></div>
    <div class="stat"><small>Wave</small><b id="wave">1</b></div>
  </div>
</header>
<main class="stage">
  <div class="board">
    <canvas id="c" width="480" height="560" aria-label="Alien Wave"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">Alien Wave</h2>
      <p id="ov-text">Shoot the aliens before they reach the ground. Hide behind the bunkers!</p>
      <button class="primary" id="go">Play</button>
    </div>
  </div>
  <p class="hint">Arrow keys move, Space fires. On a phone, hold your finger on the board: the ship follows it and keeps firing. Best: <b id="best">0</b></p>
</main>
<script src="shared.js"></script>
<script>
const W = 480, H = 560, PY = H - 40, ROWS = 5, COLS = 9, AW = 28, AH = 20, SX = 44, SY = 34;
const ROW_COLORS = ['#ef6f6c', '#b78bd6', '#b78bd6', '#7cc46a', '#7cc46a'], ROW_POINTS = [30, 20, 20, 10, 10];
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), $ = id => document.getElementById(id);
let ship, shot, aliens, fx, fy, dirX, bombs, bunkers, bombT, score, lives, wave, playing = false, keys = {}, touchX = null, firing = false, hitT = 0, t = 0, pops = [];

function newWave() {
  aliens = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) aliens.push({ r, c, alive: true });
  fx = 40; fy = Math.min(70 + (wave - 1) * 16, 150); dirX = 1; bombs = []; shot = null; bombT = 1.5;
}
function newBunkers() {
  bunkers = [];
  for (let b = 0; b < 4; b++) for (let y = 0; y < 4; y++) for (let x = 0; x < 7; x++) {
    if (y === 3 && x > 1 && x < 5) continue; // arch
    bunkers.push({ x: 52 + b * 112 + x * 8, y: H - 120 + y * 8 });
  }
}
function start() {
  ship = { x: W / 2 }; score = 0; lives = 3; wave = 1; hitT = 0; pops = [];
  newWave(); newBunkers(); hud(); playing = true; $('overlay').hidden = true;
}
function hud() { $('score').textContent = score; $('lives').textContent = lives; $('wave').textContent = wave; }
function end() {
  playing = false;
  const record = Best.save('alien-wave', score); $('best').textContent = Best.get('alien-wave');
  $('ov-title').textContent = 'Earth has fallen';
  $('ov-text').textContent = `Score ${score}, reached wave ${wave}.${record && score ? ' New best!' : ''}`;
  $('go').textContent = 'Play again'; $('overlay').hidden = false;
}
const ax = a => fx + a.c * SX, ay = a => fy + a.r * SY;
function fire() { if (playing && !shot) shot = { x: ship.x, y: PY - 14 }; }
function hitBunker(x, y) {
  const i = bunkers.findIndex(b => x >= b.x && x < b.x + 8 && y >= b.y && y < b.y + 8);
  if (i >= 0) bunkers.splice(i, 1);
  return i >= 0;
}

function step(dt) {
  t += dt;
  if (keys.ArrowLeft) ship.x -= 300 * dt;
  if (keys.ArrowRight) ship.x += 300 * dt;
  if (touchX !== null) ship.x += Math.max(-300 * dt, Math.min(300 * dt, touchX - ship.x));
  ship.x = Math.max(24, Math.min(W - 24, ship.x));
  if (firing || keys[' ']) fire();
  if (hitT > 0) hitT -= dt;

  const alive = aliens.filter(a => a.alive);
  const speed = 26 + (ROWS * COLS - alive.length) * 2.6 + wave * 8;
  fx += dirX * speed * dt;
  const minX = Math.min(...alive.map(ax)), maxX = Math.max(...alive.map(ax)) + AW;
  if ((dirX > 0 && maxX > W - 10) || (dirX < 0 && minX < 10)) { dirX = -dirX; fy += 16; }
  if (Math.max(...alive.map(ay)) + AH >= PY - 14) return end();
  // Aliens crush bunkers they walk into.
  for (const a of alive) bunkers = bunkers.filter(b => !(b.x + 8 > ax(a) && b.x < ax(a) + AW && b.y + 8 > ay(a) && b.y < ay(a) + AH));

  if (shot) {
    shot.y -= 560 * dt;
    if (shot.y < 0 || hitBunker(shot.x, shot.y)) shot = null;
    else for (const a of alive) {
      if (shot.x > ax(a) - 2 && shot.x < ax(a) + AW + 2 && shot.y > ay(a) && shot.y < ay(a) + AH) {
        a.alive = false; shot = null; score += ROW_POINTS[a.r]; hud();
        pops.push({ x: ax(a) + AW / 2, y: ay(a) + AH / 2, t: 0, color: ROW_COLORS[a.r] });
        break;
      }
    }
  }

  bombT -= dt;
  if (bombT <= 0) {
    bombT = Math.max(.35, 1.1 - wave * .08) * (.6 + Math.random() * .8);
    const cols = [...new Set(alive.map(a => a.c))], c = cols[Math.floor(Math.random() * cols.length)];
    const low = alive.filter(a => a.c === c).reduce((m, a) => a.r > m.r ? a : m);
    bombs.push({ x: ax(low) + AW / 2, y: ay(low) + AH });
  }
  for (const b of bombs) {
    b.y += (190 + wave * 10) * dt;
    if (hitBunker(b.x, b.y)) b.done = true;
    else if (hitT <= 0 && b.y > PY - 10 && b.y < PY + 12 && Math.abs(b.x - ship.x) < 20) {
      b.done = true; lives--; hitT = 1.5; hud();
      pops.push({ x: ship.x, y: PY, t: 0, color: '#f2b544' });
      if (!lives) return end();
    }
  }
  bombs = bombs.filter(b => !b.done && b.y < H);
  pops.forEach(p => p.t += dt); pops = pops.filter(p => p.t < .3);

  if (!aliens.some(a => a.alive)) { wave++; score += 100; hud(); newWave(); }
}

function drawAlien(x, y, r) {
  const leg = Math.floor(t * 3) % 2 ? 3 : -3;
  ctx.fillStyle = ROW_COLORS[r];
  ctx.beginPath(); ctx.roundRect(x + 2, y, AW - 4, AH - 6, 8); ctx.fill();
  ctx.fillRect(x + 5 + leg, y + AH - 7, 4, 7); ctx.fillRect(x + AW - 9 - leg, y + AH - 7, 4, 7);
  if (r === 0) { ctx.fillRect(x + 6, y - 5, 3, 6); ctx.fillRect(x + AW - 9, y - 5, 3, 6); }
  ctx.fillStyle = '#10231f'; ctx.fillRect(x + 8, y + 5, 4, 4); ctx.fillRect(x + AW - 12, y + 5, 4, 4);
}
function draw() {
  ctx.fillStyle = '#0b1a17'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(238,243,230,.5)';
  for (let i = 0; i < 40; i++) ctx.fillRect((i * 97) % W, (i * 53) % (H - 80), 2, 2);
  ctx.fillStyle = '#2a4b44'; ctx.fillRect(0, H - 14, W, 2);
  if (!aliens) return;
  for (const a of aliens) if (a.alive) drawAlien(ax(a), ay(a), a.r);
  ctx.fillStyle = '#7cc46a'; for (const b of bunkers) ctx.fillRect(b.x, b.y, 8, 8);
  ctx.fillStyle = '#ef6f6c'; for (const b of bombs) { ctx.fillRect(b.x - 2, b.y - 8, 4, 10); }
  if (shot) { ctx.fillStyle = '#f2b544'; ctx.fillRect(shot.x - 2, shot.y - 10, 4, 12); }
  if (ship && (hitT <= 0 || Math.floor(t * 10) % 2)) {
    ctx.fillStyle = '#eef3e6';
    ctx.beginPath(); ctx.moveTo(ship.x, PY - 14); ctx.lineTo(ship.x + 20, PY + 10); ctx.lineTo(ship.x - 20, PY + 10); ctx.fill();
    ctx.fillStyle = '#7fd1e8'; ctx.beginPath(); ctx.arc(ship.x, PY + 2, 5, 0, 7); ctx.fill();
  }
  for (const p of pops) { ctx.globalAlpha = 1 - p.t / .3; ctx.strokeStyle = p.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, 6 + p.t * 60, 0, 7); ctx.stroke(); ctx.globalAlpha = 1; }
}

const toX = e => { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; };
cv.addEventListener('pointerdown', e => { touchX = toX(e); firing = true; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if (firing) touchX = toX(e); });
cv.addEventListener('pointerup', () => { touchX = null; firing = false; });
cv.addEventListener('pointercancel', () => { touchX = null; firing = false; });
addEventListener('keydown', e => { if (['ArrowLeft', 'ArrowRight', ' '].includes(e.key)) { e.preventDefault(); keys[e.key] = true; } });
addEventListener('keyup', e => { keys[e.key] = false; });
$('go').onclick = start;
$('best').textContent = Best.get('alien-wave');
wave = 1; newWave(); newBunkers();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.04, (now - last) / 1000); last = now;
  if (playing) step(dt); else t += dt;
  draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
