<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Type Storm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  .sky { position: relative; width: min(100%, 460px); height: 360px; background: #1d4a3a; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; }
  .grain { position: absolute; inset: 0; background: radial-gradient(circle at 50% 120%, rgba(242,181,68,.08), transparent 60%); }
  .word { position: absolute; left: 50%; transform: translateX(-50%); font-family: var(--display); font-size: 20px; letter-spacing: 2px; color: var(--muted); white-space: nowrap; user-select: none; }
  .word .typed { color: var(--gold); }
  .lives { letter-spacing: 4px; }
</style>
</head>
<body>
<header class="top">
  <a class="back" href="../index.html">← Library</a>
  <h1>Type Storm</h1>
  <div class="stats">
    <div class="stat"><small>Words</small><b id="score">0</b></div>
    <div class="stat"><small>Lives</small><b class="lives" id="lives">♥♥♥</b></div>
    <div class="stat"><small>Best</small><b id="best">0</b></div>
  </div>
</header>
<main class="stage">
  <div class="sky" id="sky">
    <div class="grain"></div>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">Type Storm</h2>
      <p id="ov-text">Type the falling words before they reach the ground. Three missed words end the run.</p>
      <button class="primary" id="go">Play</button>
    </div>
  </div>
  <p class="hint">Just start typing — the first matching falling word gets your letter. Speed rises as your score climbs.</p>
</main>
<script src="shared.js"></script>
<script>
const WORDS = ['SUN', 'MOON', 'STAR', 'FIRE', 'WIND', 'RAIN', 'SNOW', 'MIST', 'TIDE', 'ROCK', 'LEAF', 'BIRD', 'FISH', 'WOLF', 'DEER', 'HAWK', 'CLOUD', 'STORM', 'RIVER', 'FOREST', 'MEADOW', 'MOUNT', 'VALLEY', 'CAVE', 'FLAME', 'SHINE', 'SPARK', 'BLOOM', 'GROVE', 'HILL'];
const $ = id => document.getElementById(id);
const sky = $('sky');
let playing, words, score, lives, spawn, last;

function reset() {
  sky.querySelectorAll('.word').forEach(w => w.remove());
  words = []; score = 0; lives = 3; spawn = 1.2;
  $('score').textContent = 0;
  $('lives').textContent = '♥♥♥';
  $('overlay').hidden = true;
  playing = true;
}
function addWord() {
  const text = WORDS[Math.floor(Math.random() * WORDS.length)];
  const el = document.createElement('div');
  el.className = 'word';
  el.innerHTML = `<span class="typed"></span>${text}`;
  el.style.top = '-40px';
  sky.appendChild(el);
  const w = { el, text, typed: 0, y: -40, speed: 55 + Math.random() * 25 + score * 1.4 };
  words.push(w);
}
function typeKey(k) {
  if (!playing) return;
  for (const w of words) {
    if (w.text[w.typed] && w.text[w.typed].toLowerCase() === k) {
      w.typed++;
      if (w.typed === w.text.length) { w.el.remove(); words.splice(words.indexOf(w), 1); score++; $('score').textContent = score; }
      else w.el.innerHTML = `<span class="typed">${w.text.slice(0, w.typed)}</span>${w.text.slice(w.typed)}`;
      return;
    }
  }
}
function frame(now) {
  if (!last) last = now;
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) {
    spawn -= dt;
    if (spawn <= 0) { addWord(); spawn = Math.max(0.5, 1.25 - score * 0.025) * (0.7 + Math.random() * 0.6); }
    for (let i = words.length - 1; i >= 0; i--) {
      const w = words[i];
      w.y += w.speed * dt;
      if (w.y > 330) {
        w.el.remove(); words.splice(i, 1);
        lives--; $('lives').textContent = '♥'.repeat(Math.max(0, lives));
        if (lives <= 0) { end(); break; }
      } else w.el.style.transform = `translate(-50%, ${w.y}px)`;
    }
  }
  requestAnimationFrame(frame);
}
function end() {
  playing = false;
  const record = Best.save('type-storm', score);
  $('best').textContent = Best.get('type-storm');
  $('ov-title').textContent = 'Game over';
  $('ov-text').textContent = `You typed ${score} ${score === 1 ? 'word' : 'words'}.${record ? ' New best!' : ''}`;
  $('go').textContent = 'Play again';
  $('overlay').hidden = false;
}
addEventListener('keydown', e => {
  if (/^[a-z]$/i.test(e.key)) typeKey(e.key.toLowerCase());
});
$('go').onclick = reset;
$('best').textContent = Best.get('type-storm');
reset(); requestAnimationFrame(frame);
</script>
</body>
</html>
