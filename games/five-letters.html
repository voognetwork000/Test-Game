<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five Letters</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  .rows { display: grid; grid-template-rows: repeat(6, 1fr); gap: 6px; width: min(100%, 320px); }
  .wrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .wrow.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .tile { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border: 2px solid var(--line); border-radius: 6px; font-family: var(--display); font-size: clamp(24px, 8vw, 34px); text-transform: uppercase; }
  .tile.filled { border-color: var(--muted); }
  .hit { background: #5aa05a; border-color: #5aa05a !important; }
  .near { background: #c9a227; border-color: #c9a227 !important; }
  .miss { background: #33443f; border-color: #33443f !important; }
  .kb { display: flex; flex-direction: column; gap: 6px; width: min(100%, 500px); }
  .kb div { display: flex; gap: 5px; justify-content: center; }
  .kb button { flex: 1; max-width: 44px; height: 52px; padding: 0; font-size: 15px; text-transform: uppercase; }
  .kb button.wide { max-width: 68px; flex: 1.5; font-size: 13px; }
  .msg { min-height: 24px; margin: 0; font-weight: 800; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .wrow.shake { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <a class="back" href="../index.html">← Library</a>
  <h1>Five Letters</h1>
  <div class="stats">
    <div class="stat"><small>Wins</small><b id="wins">0</b></div>
    <div class="stat"><small>Streak</small><b id="streak">0</b></div>
  </div>
</header>
<main class="stage">
  <p class="msg" id="msg">Guess the secret 5-letter word in 6 tries.</p>
  <div class="rows" id="rows"></div>
  <div class="kb" id="kb"></div>
  <button class="primary" id="next" hidden>New word</button>
  <p class="hint">Green: right letter, right spot. Yellow: the letter is in the word but in another spot. Grey: not in the word.</p>
</main>
<script src="shared.js"></script>
<script>
// shortcut: guesses are not checked against a dictionary; add a full word list to reject made-up words.
const WORDS = `apple beach brain bread brick bring brush candy chair chalk charm cheap chess chest chief child cloud clown coach coast crane crown dance dream drink eagle earth feast field flame float flock floor flute focus frame fresh fruit ghost giant glass globe grape grass green heart honey horse house humor jelly juice knife laugh lemon light lucky magic mango maple march money month mouse movie music night ocean olive orbit paint panda party peace pearl piano pilot pizza plane plant plate point power pride prize queen quiet radio raven river robot rocky royal salad scale scarf shark sheep shell shine shirt sight skate sleep smile snack snake space spark spoon sport stage stamp start steam stone storm story sugar sunny swing table tiger toast tooth torch tower track train treat truck trust uncle unity value video voice watch water whale wheat wheel world young zebra`.split(' ');
console.assert(WORDS.every(w => /^[a-z]{5}$/.test(w)), 'all words have 5 letters');

const $ = id => document.getElementById(id);
let answer, row, guess, over, keyState = {};
let streak = 0;

// Duplicate letters only count as many times as they appear in the answer.
function score(g, a) {
  const res = Array(5).fill('miss'), left = {};
  for (let i = 0; i < 5; i++) if (g[i] === a[i]) res[i] = 'hit'; else left[a[i]] = (left[a[i]] || 0) + 1;
  for (let i = 0; i < 5; i++) if (res[i] !== 'hit' && left[g[i]]) { res[i] = 'near'; left[g[i]]--; }
  return res;
}
console.assert(score('llama', 'hello').join() === 'near,near,miss,miss,miss', 'duplicate letters');
console.assert(score('speed', 'erase').join() === 'near,miss,near,near,miss', 'only as many yellows as letters');

function newGame() {
  answer = WORDS[Math.floor(Math.random() * WORDS.length)];
  row = 0; guess = ''; over = false; keyState = {};
  $('rows').innerHTML = Array.from({ length: 6 }, () => `<div class="wrow">${'<div class="tile"></div>'.repeat(5)}</div>`).join('');
  $('msg').textContent = 'Guess the secret 5-letter word in 6 tries.';
  $('next').hidden = true; renderKb();
}
function renderRow() {
  [...$('rows').children[row].children].forEach((t, i) => { t.textContent = guess[i] || ''; t.classList.toggle('filled', !!guess[i]); });
}
function renderKb() {
  $('kb').innerHTML = ['qwertyuiop', 'asdfghjkl', '+zxcvbnm-'].map(r => `<div>${[...r].map(k =>
    k === '+' ? '<button class="wide" data-k="Enter">Enter</button>' : k === '-' ? '<button class="wide" data-k="Backspace" aria-label="Delete">⌫</button>'
      : `<button data-k="${k}" class="${keyState[k] || ''}">${k}</button>`).join('')}</div>`).join('');
  document.querySelectorAll('#kb button').forEach(b => b.onclick = () => key(b.dataset.k));
}
function key(k) {
  if (over) return;
  if (k === 'Backspace') guess = guess.slice(0, -1);
  else if (k === 'Enter') return submit();
  else if (/^[a-z]$/.test(k) && guess.length < 5) guess += k;
  renderRow();
}
function submit() {
  const rowEl = $('rows').children[row];
  if (guess.length < 5) {
    $('msg').textContent = 'Type all 5 letters first.';
    rowEl.classList.remove('shake'); void rowEl.offsetWidth; rowEl.classList.add('shake');
    return;
  }
  const res = score(guess, answer), rank = { miss: 1, near: 2, hit: 3 };
  [...rowEl.children].forEach((t, i) => t.classList.add(res[i]));
  [...guess].forEach((ch, i) => { if (!keyState[ch] || rank[res[i]] > rank[keyState[ch]]) keyState[ch] = res[i]; });
  renderKb();
  if (guess === answer) {
    over = true; streak++; Best.addWin('five-letters');
    $('msg').textContent = ['Genius!', 'Amazing!', 'Great!', 'Nice!', 'Good job!', 'Phew!'][row];
  } else if (++row === 6) {
    over = true; streak = 0;
    $('msg').textContent = `The word was ${answer.toUpperCase()}.`;
  } else $('msg').textContent = '';
  guess = '';
  $('wins').textContent = Best.get('five-letters'); $('streak').textContent = streak;
  if (over) $('next').hidden = false;
}
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter' && over) return newGame();
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (k === 'Enter' || k === 'Backspace' || /^[a-z]$/.test(k)) { e.preventDefault(); key(k); }
});
$('next').onclick = newGame;
$('wins').textContent = Best.get('five-letters');
newGame();
</script>
</body>
</html>
