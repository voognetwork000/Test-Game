<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2048</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  .board { max-width: 440px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 10px; background: var(--panel); border: 2px solid var(--line); border-radius: 12px; aspect-ratio: 1; touch-action: none; }
  .cell { border-radius: 8px; background: #20423b; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: clamp(20px, 8vw, 38px); color: #2b1d00; }
  .cell.new { animation: pop .15s ease-out; }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .cell.new { animation: none; } }
</style>
</head>
<body>
<header class="top">
  <a class="back" href="../index.html">← Library</a>
  <h1>2048</h1>
  <div class="stats">
    <div class="stat"><small>Score</small><b id="score">0</b></div>
    <div class="stat"><small>Best</small><b id="best">0</b></div>
  </div>
</header>
<main class="stage">
  <div class="board">
    <div class="grid" id="grid" aria-label="2048 board"></div>
    <div class="overlay" id="overlay" hidden>
      <h2 id="ov-title">No moves left</h2>
      <p id="ov-text"></p>
      <div class="row"><button id="keep" hidden>Keep going</button><button class="primary" id="again">New game</button></div>
    </div>
  </div>
  <p class="hint">Slide the tiles with the arrow keys or by swiping. Two matching tiles merge into one. Reach 2048!</p>
  <button id="restart">New game</button>
</main>
<script src="shared.js"></script>
<script>
const $ = id => document.getElementById(id);
const COLORS = { 2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#f2b544' };
let cells, score, wonShown, newIdx;

// Slides one line toward index 0 and merges equal neighbours once.
function slide(line) {
  const nums = line.filter(Boolean), out = [];
  let gained = 0;
  for (let i = 0; i < nums.length; i++) {
    if (nums[i] === nums[i + 1]) { out.push(nums[i] * 2); gained += nums[i] * 2; i++; }
    else out.push(nums[i]);
  }
  while (out.length < 4) out.push(0);
  return { line: out, gained };
}
console.assert(slide([2, 2, 2, 2]).line.join() === '4,4,0,0', 'merge pairs once');
console.assert(slide([0, 4, 4, 8]).line.join() === '8,8,0,0', 'merge then keep');

// Index lists for each line, ordered from the side tiles slide toward.
function lines(d) {
  const L = [];
  for (let i = 0; i < 4; i++) {
    const l = [];
    for (let j = 0; j < 4; j++) l.push(d === 'left' ? i * 4 + j : d === 'right' ? i * 4 + 3 - j : d === 'up' ? j * 4 + i : (3 - j) * 4 + i);
    L.push(l);
  }
  return L;
}
function addTile() {
  const empty = cells.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  if (!empty.length) return;
  newIdx = empty[Math.floor(Math.random() * empty.length)];
  cells[newIdx] = Math.random() < .9 ? 2 : 4;
}
function canMove() {
  return cells.some((v, i) => !v || (i % 4 < 3 && v === cells[i + 1]) || (i < 12 && v === cells[i + 4]));
}
function move(d) {
  if (!$('overlay').hidden) return;
  let moved = false;
  for (const idx of lines(d)) {
    const { line, gained } = slide(idx.map(i => cells[i]));
    idx.forEach((c, k) => { if (cells[c] !== line[k]) moved = true; cells[c] = line[k]; });
    score += gained;
  }
  if (!moved) return;
  addTile(); render();
  if (!wonShown && cells.includes(2048)) { wonShown = true; show('You made 2048!', 'Keep going for a bigger tile, or start over.', true); }
  else if (!canMove()) show('No moves left', `Final score: ${score}.`, false);
}
function show(title, text, canKeep) {
  Best.save('2048', score); $('best').textContent = Best.get('2048');
  $('ov-title').textContent = title; $('ov-text').textContent = text;
  $('keep').hidden = !canKeep; $('overlay').hidden = false;
}
function render() {
  $('grid').innerHTML = cells.map((v, i) =>
    `<div class="cell${i === newIdx ? ' new' : ''}" style="${v ? `background:${COLORS[v] || '#3c3a32'};${v > 4 ? 'color:#fff' : ''};${v >= 1024 ? 'font-size:clamp(16px,6vw,30px)' : ''}` : ''}">${v || ''}</div>`).join('');
  $('score').textContent = score;
  if (score > Best.get('2048')) { Best.save('2048', score); $('best').textContent = score; }
}
function reset() {
  cells = Array(16).fill(0); score = 0; wonShown = false;
  addTile(); addTile(); $('overlay').hidden = true; render();
}
onDirection($('grid'), move);
$('again').onclick = $('restart').onclick = reset;
$('keep').onclick = () => { $('overlay').hidden = true; };
$('best').textContent = Best.get('2048');
reset();
</script>
</body>
</html>
