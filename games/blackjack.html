<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blackjack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  .table { width: min(100%, 480px); background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .hand { display: flex; flex-direction: column; gap: 6px; }
  .hand b { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px; }
  .cards { display: flex; flex-wrap: wrap; gap: 8px; min-height: 76px; }
  .card { background: #fbf7ec; color: #1d1d1d; border-radius: 8px; padding: 8px 10px; font-weight: 800; font-size: 20px; min-width: 44px; text-align: center; box-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .card.red { color: #c0392b; }
  .card.hidden { background: repeating-linear-gradient(45deg, #2a4b44 0 6px, #1a3a32 6px 12px); color: transparent; }
  .total { font-family: var(--display); font-size: 24px; }
  .msg { font-family: var(--display); font-size: 22px; text-align: center; min-height: 30px; margin: 0; }
</style>
</head>
<body>
<header class="top">
  <a class="back" href="../index.html">← Library</a>
  <h1>Blackjack</h1>
  <div class="stats">
    <div class="stat"><small>Wins</small><b id="best">0</b></div>
    <div class="stat"><small>Losses</small><b id="losses">0</b></div>
  </div>
</header>
<main class="stage">
  <div class="table">
    <div class="hand">
      <b>Dealer</b>
      <div class="cards" id="dcards"></div>
      <div class="total" id="dtotal"></div>
    </div>
    <p class="msg" id="msg">Click Deal to play.</p>
    <div class="hand">
      <b>You</b>
      <div class="cards" id="pcards"></div>
      <div class="total" id="ptotal"></div>
    </div>
    <div class="row">
      <button class="primary" id="deal">Deal</button>
      <button id="hit" hidden>Hit</button>
      <button id="stand" hidden>Stand</button>
    </div>
  </div>
  <p class="hint">Get closer to 21 than the dealer without going over. Dealer must stand on 17.</p>
</main>
<script src="shared.js"></script>
<script>
const $ = id => document.getElementById(id);
const SUITS = ['♠', '♥', '♦', '♣'];
let deck, player, dealer, over;

function freshDeck() {
  deck = [];
  for (let s = 0; s < 4; s++) for (let v = 1; v <= 13; v++) deck.push({ v, s });
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
}
const points = c => c.v === 1 ? 11 : Math.min(c.v, 10);
function handValue(hand) {
  let v = hand.reduce((a, c) => a + points(c), 0), aces = hand.filter(c => c.v === 1).length;
  while (v > 21 && aces--) v -= 10;
  return v;
}
const cardEl = (c, hidden) => `<div class="card${c.s === 1 || c.s === 2 ? ' red' : ''}${hidden ? ' hidden' : ''}">${hidden ? '?' : (c.v === 1 ? 'A' : c.v === 11 ? 'J' : c.v === 12 ? 'Q' : c.v === 13 ? 'K' : c.v) + SUITS[c.s]}</div>`;
function render() {
  $('dcards').innerHTML = dealer.map((c, i) => cardEl(c, !over && i === 0)).join('');
  $('pcards').innerHTML = player.map(c => cardEl(c)).join('');
  $('dtotal').textContent = 'Total: ' + handValue(dealer);
  $('ptotal').textContent = 'Total: ' + handValue(player);
}
function deal() {
  freshDeck();
  player = [deck.pop(), deck.pop()]; dealer = [deck.pop(), deck.pop()];
  over = false;
  $('deal').hidden = true; $('hit').hidden = false; $('stand').hidden = false;
  $('msg').textContent = 'Your turn.';
  render();
  if (handValue(player) === 21) finish();
}
function hit() {
  player.push(deck.pop());
  render();
  if (handValue(player) > 21) { $('msg').textContent = 'Bust! You went over 21.'; finish(true); }
  else if (handValue(player) === 21) finish();
}
function stand() { dealerPlay(); }
function dealerPlay() {
  $('hit').hidden = true; $('stand').hidden = true;
  over = true;
  render();
  const t = setInterval(() => {
    if (handValue(dealer) < 17 && handValue(player) <= 21) { dealer.push(deck.pop()); render(); }
    else { clearInterval(t); finish(); }
  }, 550);
}
function finish(busted) {
  $('hit').hidden = true; $('stand').hidden = true;
  over = true;
  const p = handValue(player), d = handValue(dealer);
  let msg;
  if (busted || p > 21) { msg = 'Bust — dealer wins.'; $('losses').textContent = Number($('losses').textContent) + 1; }
  else if (d > 21) { msg = 'Dealer busts — you win!'; Best.save('blackjack', Best.get('blackjack') + 1); }
  else if (p > d) { msg = 'You win!'; Best.save('blackjack', Best.get('blackjack') + 1); }
  else if (p < d) { msg = 'Dealer wins.'; $('losses').textContent = Number($('losses').textContent) + 1; }
  else msg = "Push — it's a tie.";
  $('best').textContent = Best.get('blackjack');
  $('msg').textContent = msg;
  render();
  $('deal').hidden = false;
}
$('deal').onclick = deal;
$('hit').onclick = hit;
$('stand').onclick = stand;
$('best').textContent = Best.get('blackjack');
deal();
</script>
</body>
</html>
