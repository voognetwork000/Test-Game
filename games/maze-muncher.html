<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maze Muncher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  .board { max-width: 456px; }
  .pad { display: grid; grid-template-columns: repeat(3, 56px); gap: 6px; }
  .pad button { height: 48px; padding: 0; font-size: 20px; }
  .pad .up { grid-column: 2; } .pad .left { grid-column: 1; grid-row: 2; } .pad .down { grid-column: 2; grid-row: 2; } .pad .right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>
<header class="top">
  <a class="back" href="../index.html">← Library</a>
  <h1>Maze Muncher</h1>
  <div class="stats">
    <div class="stat"><small>Score</small><b id="score">0</b></div>
    <div class="stat"><small>Lives</small><b id="lives">3</b></div>
    <div class="stat"><small>Level</small><b id="level">1</b></div>
  </div>
</header>
<main class="stage">
  <div class="board">
    <canvas id="c" width="456" height="504" aria-label="Maze"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">Maze Muncher</h2>
      <p id="ov-text">Eat every dot and dodge the ghosts. Big dots let you eat the ghosts for a few seconds!</p>
      <button class="primary" id="go">Play</button>
    </div>
  </div>
  <div class="pad" aria-label="Direction buttons">
    <button class="up" data-d="up" aria-label="Up">▲</button>
    <button class="left" data-d="left" aria-label="Left">◀</button>
    <button class="down" data-d="down" aria-label="Down">▼</button>
    <button class="right" data-d="right" aria-label="Right">▶</button>
  </div>
  <p class="hint">Arrow keys or swipe to steer. Best score: <b id="best">0</b></p>
</main>
<script src="shared.js"></script>
<script>
// # wall, . dot, o big dot, - ghost door, G ghost home, P start. Row 9 wraps around.
const MAP = [
  '###################',
  '#........#........#',
  '#o##.###.#.###.##o#',
  '#.................#',
  '#.##.#.#####.#.##.#',
  '#....#...#...#....#',
  '####.###.#.###.####',
  '   #.#.......#.#   ',
  '####.#.##-##.#.####',
  '    ...#GGG#...    ',
  '####.#.#####.#.####',
  '   #.#.......#.#   ',
  '####.#.#####.#.####',
  '#........#........#',
  '#.##.###.#.###.##.#',
  '#o.#.....P.....#.o#',
  '##.#.#.#####.#.#.##',
  '#....#...#...#....#',
  '#.######.#.######.#',
  '#.................#',
  '###################',
];
const W = 19, H = MAP.length, T = 24;
console.assert(MAP.every(r => r.length === W), 'maze rows are all 19 wide');
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };
const GHOSTS = [{ color: '#ef6f6c', home: [8, 9] }, { color: '#f49ac1', home: [9, 9] }, { color: '#7fd1e8', home: [10, 9] }, { color: '#f4a261', home: [9, 9] }];
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), $ = id => document.getElementById(id);
const wrap = x => (x + W) % W;
const open = (x, y, d) => { const nx = wrap(x + DIRS[d][0]), ny = y + DIRS[d][1]; return ny >= 0 && ny < H && !'#-'.includes(MAP[ny][nx]); };
let dots, pac, ghosts, score, lives, level, frightT, eatChain, pauseT, playing = false, t = 0;

function resetDots() {
  dots = new Map();
  MAP.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === '.' || ch === 'o') dots.set(x + ',' + y, ch); }));
}
function resetActors() {
  pac = { tx: 9, ty: 15, p: 0, dir: 'left', next: 'left', moving: false };
  ghosts = GHOSTS.map((g, i) => ({ ...g, tx: g.home[0], ty: g.home[1], p: 0, dir: 'left', inHouse: true, releaseT: i * 3 }));
  frightT = 0; pauseT = 1.2;
}
function start() {
  score = 0; lives = 3; level = 1; playing = true;
  resetDots(); resetActors(); hud(); $('overlay').hidden = true;
}
function hud() { $('score').textContent = score; $('lives').textContent = lives; $('level').textContent = level; }

function eat() {
  const k = pac.tx + ',' + pac.ty, d = dots.get(k);
  if (!d) return;
  dots.delete(k);
  score += d === 'o' ? 50 : 10;
  if (d === 'o') { frightT = Math.max(2, 7 - level); eatChain = 0; ghosts.forEach(g => { if (!g.inHouse) g.dir = OPP[g.dir]; }); }
  hud();
  if (!dots.size) { level++; resetDots(); resetActors(); hud(); }
}

function step(e, dt, speed) {
  e.p += speed * dt;
  if (e.p < 1) return false;
  e.tx = wrap(e.tx + DIRS[e.dir][0]); e.ty += DIRS[e.dir][1]; e.p = 0;
  return true;
}
function movePac(dt) {
  // Reversing works mid-tile; other turns wait for the next tile center.
  if (pac.p > 0 && pac.next === OPP[pac.dir]) {
    pac.tx = wrap(pac.tx + DIRS[pac.dir][0]); pac.ty += DIRS[pac.dir][1]; pac.p = 1 - pac.p; pac.dir = pac.next;
  }
  if (pac.p === 0) {
    if (open(pac.tx, pac.ty, pac.next)) pac.dir = pac.next;
    pac.moving = open(pac.tx, pac.ty, pac.dir);
    if (!pac.moving) return;
  }
  if (step(pac, dt, 7)) eat();
}
function targetFor(g, i) {
  const [dx, dy] = DIRS[pac.dir], dist = Math.hypot(g.tx - pac.tx, g.ty - pac.ty);
  if (i === 1) return [pac.tx + dx * 4, pac.ty + dy * 4];
  if (i === 2 && dist < 6) return [0, H];
  if (i === 3 && dist < 8) return [W, H];
  return [pac.tx, pac.ty];
}
function moveGhost(g, i, dt) {
  if (g.inHouse) {
    g.releaseT -= dt;
    if (g.releaseT <= 0) Object.assign(g, { inHouse: false, tx: 9, ty: 7, p: 0, dir: Math.random() < .5 ? 'left' : 'right' });
    return;
  }
  if (g.p === 0) {
    let opts = Object.keys(DIRS).filter(d => d !== OPP[g.dir] && open(g.tx, g.ty, d));
    if (!opts.length) opts = [OPP[g.dir]];
    if (frightT > 0) g.dir = opts[Math.floor(Math.random() * opts.length)];
    else {
      const [x, y] = targetFor(g, i);
      g.dir = opts.reduce((a, d) => {
        const da = Math.hypot(g.tx + DIRS[a][0] - x, g.ty + DIRS[a][1] - y), dd = Math.hypot(g.tx + DIRS[d][0] - x, g.ty + DIRS[d][1] - y);
        return dd < da ? d : a;
      });
    }
  }
  step(g, dt, frightT > 0 ? 4 : Math.min(7.2, 6 + level * .25));
}
const posOf = e => [e.tx + DIRS[e.dir][0] * e.p, e.ty + DIRS[e.dir][1] * e.p];

function update(dt) {
  t += dt;
  if (pauseT > 0) { pauseT -= dt; return; }
  if (frightT > 0) frightT -= dt;
  movePac(dt);
  ghosts.forEach((g, i) => moveGhost(g, i, dt));
  const [px, py] = posOf(pac);
  for (const g of ghosts) {
    if (g.inHouse) continue;
    const [gx, gy] = posOf(g);
    if (Math.hypot(gx - px, gy - py) > .7) continue;
    if (frightT > 0) {
      score += 200 * 2 ** eatChain++; hud();
      Object.assign(g, { inHouse: true, tx: g.home[0], ty: g.home[1], p: 0, releaseT: 2 });
    } else {
      lives--; hud();
      if (!lives) return end();
      resetActors(); return;
    }
  }
}
function end() {
  playing = false;
  const record = Best.save('maze-muncher', score); $('best').textContent = Best.get('maze-muncher');
  $('ov-title').textContent = 'Caught!';
  $('ov-text').textContent = `Score ${score}, level ${level}.${record && score ? ' New best!' : ''}`;
  $('go').textContent = 'Play again'; $('overlay').hidden = false;
}

const walls = document.createElement('canvas');
walls.width = cv.width; walls.height = cv.height;
(() => {
  const g = walls.getContext('2d');
  g.fillStyle = '#0d1d1a'; g.fillRect(0, 0, cv.width, cv.height);
  MAP.forEach((row, y) => [...row].forEach((ch, x) => {
    if (ch === '#') { g.fillStyle = '#2f6f6a'; g.beginPath(); g.roundRect(x * T + 2, y * T + 2, T - 4, T - 4, 5); g.fill(); }
    if (ch === '-') { g.fillStyle = '#f49ac1'; g.fillRect(x * T, y * T + T / 2 - 2, T, 4); }
  }));
})();

function drawGhost(g) {
  const [x, y] = g.inHouse ? [g.tx, g.ty] : posOf(g), cx = x * T + T / 2, cy = y * T + T / 2, r = T / 2 - 2;
  const scared = frightT > 0 && !g.inHouse, flash = scared && frightT < 1.5 && Math.floor(t * 6) % 2;
  ctx.fillStyle = scared ? (flash ? '#eef3e6' : '#3a5bd9') : g.color;
  ctx.beginPath(); ctx.arc(cx, cy - 1, r, Math.PI, 0); ctx.lineTo(cx + r, cy + r);
  for (let i = 0; i < 4; i++) ctx.lineTo(cx + r - (i + .5) * r / 2, cy + r - (i % 2 ? 0 : 4));
  ctx.lineTo(cx - r, cy + r); ctx.fill();
  if (scared) { ctx.fillStyle = flash ? '#ef6f6c' : '#eef3e6'; ctx.fillRect(cx - 5, cy - 4, 3, 3); ctx.fillRect(cx + 2, cy - 4, 3, 3); return; }
  const [dx, dy] = DIRS[g.dir];
  for (const s of [-4, 4]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + s, cy - 3, 3.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#1d2a5a'; ctx.beginPath(); ctx.arc(cx + s + dx * 1.5, cy - 3 + dy * 1.5, 1.8, 0, 7); ctx.fill();
  }
}
function draw() {
  ctx.drawImage(walls, 0, 0);
  for (const [k, d] of dots ?? []) {
    const [x, y] = k.split(',').map(Number);
    ctx.fillStyle = '#f4ecd8'; ctx.beginPath();
    ctx.arc(x * T + T / 2, y * T + T / 2, d === 'o' ? 5 + Math.sin(t * 6) : 2.5, 0, 7); ctx.fill();
  }
  if (!pac) return;
  ghosts.forEach(drawGhost);
  const [x, y] = posOf(pac), mouth = pac.moving ? (Math.sin(t * 18) + 1) * .2 + .05 : .25;
  const ang = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[pac.dir];
  ctx.fillStyle = '#f2b544'; ctx.beginPath(); ctx.moveTo(x * T + T / 2, y * T + T / 2);
  ctx.arc(x * T + T / 2, y * T + T / 2, T / 2 - 1, ang + mouth * Math.PI, ang - mouth * Math.PI + 2 * Math.PI); ctx.fill();
  if (pauseT > 0 && playing) { ctx.fillStyle = '#f2b544'; ctx.font = '22px "Lilita One", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Ready!', cv.width / 2, 11 * T + 17); }
}

onDirection(cv, d => { if (pac) pac.next = d; });
document.querySelectorAll('.pad button').forEach(b => b.onclick = () => { if (pac) pac.next = b.dataset.d; });
$('go').onclick = start;
$('best').textContent = Best.get('maze-muncher');
resetDots(); resetActors();
let last = performance.now();
function frame(now) {
  const dt = Math.min(.04, (now - last) / 1000); last = now;
  if (playing) update(dt);
  draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
