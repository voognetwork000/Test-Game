<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fruit Slicer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>.board { max-width: 480px; } canvas { cursor: crosshair; }</style>
</head>
<body>
<header class="top">
  <a class="back" href="../index.html">← Library</a>
  <h1>Fruit Slicer</h1>
  <div class="stats">
    <div class="stat"><small>Score</small><b id="score">0</b></div>
    <div class="stat"><small>Misses</small><b id="miss">0 / 3</b></div>
    <div class="stat"><small>Best</small><b id="best">0</b></div>
  </div>
</header>
<main class="stage">
  <div class="board">
    <canvas id="c" width="480" height="600" aria-label="Fruit Slicer"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">Fruit Slicer</h2>
      <p id="ov-text">Swipe across the fruit to slice it. Never slice a bomb, and don't let 3 fruits fall!</p>
      <button class="primary" id="go">Play</button>
    </div>
  </div>
  <p class="hint">Drag your mouse or finger across the board. Slice 3 or more in one swipe for a combo bonus.</p>
</main>
<script src="shared.js"></script>
<script>
const W = 480, H = 600, G = 520;
const FRUITS = [
  { skin: '#3f9a4a', flesh: '#ef6f6c', r: 30 }, { skin: '#f4a261', flesh: '#f8c48c', r: 22 },
  { skin: '#d94a4a', flesh: '#f4ecd8', r: 22 }, { skin: '#f2d544', flesh: '#faf0a0', r: 20 },
  { skin: '#7a4fa3', flesh: '#d9b8f0', r: 18 }, { skin: '#9bd17b', flesh: '#e4f5c9', r: 20 },
];
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), $ = id => document.getElementById(id);
let items, halves, drops, trail, texts, score, misses, spawnT, elapsed, playing = false, swiping = false, swipeCount = 0, lastPt = null, boom = 0;

function start() {
  items = []; halves = []; drops = []; trail = []; texts = [];
  score = 0; misses = 0; spawnT = .5; elapsed = 0; boom = 0; playing = true;
  hud(); $('overlay').hidden = true;
}
function hud() { $('score').textContent = score; $('miss').textContent = misses + ' / 3'; }
function end(text) {
  playing = false; swiping = false;
  const record = Best.save('fruit-slicer', score); $('best').textContent = Best.get('fruit-slicer');
  $('ov-title').textContent = text;
  $('ov-text').textContent = `You sliced ${score} fruit.${record && score ? ' New best!' : ''}`;
  $('go').textContent = 'Play again';
  setTimeout(() => { $('overlay').hidden = false; }, 600);
}
function launch() {
  const n = 1 + Math.floor(Math.random() * Math.min(4, 1 + elapsed / 15));
  for (let i = 0; i < n; i++) {
    const bomb = Math.random() < Math.min(.25, .08 + elapsed / 300);
    const f = FRUITS[Math.floor(Math.random() * FRUITS.length)], x = 70 + Math.random() * (W - 140);
    items.push({ x, y: H + 30, vx: (W / 2 - x) * (.3 + Math.random() * .4), vy: -(560 + Math.random() * 140), rot: 0, vr: Math.random() * 4 - 2, bomb, ...(bomb ? { r: 22 } : f) });
  }
}
// Distance from point (px,py) to segment a-b.
function segDist(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, len = dx * dx + dy * dy;
  const k = len ? Math.max(0, Math.min(1, ((px - a.x) * dx + (py - a.y) * dy) / len)) : 0;
  return Math.hypot(px - a.x - k * dx, py - a.y - k * dy);
}
console.assert(segDist(5, 5, { x: 0, y: 0 }, { x: 10, y: 0 }) === 5, 'segment distance');

function slice(a, b) {
  for (const it of items) {
    if (it.cut || segDist(it.x, it.y, a, b) > it.r) continue;
    it.cut = true;
    if (it.bomb) { boom = .6; return end('Boom!'); }
    score++; swipeCount++; hud();
    const ang = Math.atan2(b.y - a.y, b.x - a.x), nx = -Math.sin(ang), ny = Math.cos(ang);
    for (const s of [-1, 1]) halves.push({ ...it, vx: it.vx + nx * s * 80, vy: it.vy + ny * s * 80 - 40, ang, side: s, vr: s * 3 });
    for (let i = 0; i < 10; i++) drops.push({ x: it.x, y: it.y, vx: Math.random() * 300 - 150, vy: Math.random() * 300 - 200, life: .5, color: it.flesh });
  }
}

function step(dt) {
  elapsed += dt;
  spawnT -= dt;
  if (spawnT <= 0) { launch(); spawnT = Math.max(.55, 1.4 - elapsed / 60); }
  for (const it of [...items, ...halves]) { it.vy += G * dt; it.x += it.vx * dt; it.y += it.vy * dt; it.rot += it.vr * dt; }
  for (const it of items) if (!it.cut && it.vy > 0 && it.y > H + 40) {
    it.cut = true;
    if (!it.bomb) { misses++; hud(); if (misses >= 3) return end('Too many missed'); }
  }
  items = items.filter(i => !i.cut);
  halves = halves.filter(h => h.y < H + 60);
  for (const d of drops) { d.vy += G * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt; }
  drops = drops.filter(d => d.life > 0);
  texts.forEach(x => x.t += dt); texts = texts.filter(x => x.t < 1);
  trail = trail.filter(p => performance.now() - p.time < 140);
}

function drawFruit(it, half) {
  ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(half ? it.ang : it.rot);
  ctx.beginPath();
  if (half) ctx.arc(0, 0, it.r, it.side > 0 ? 0 : Math.PI, it.side > 0 ? Math.PI : 2 * Math.PI);
  else ctx.arc(0, 0, it.r, 0, 7);
  ctx.fillStyle = it.skin; ctx.fill();
  if (half) { ctx.beginPath(); ctx.arc(0, 0, it.r * .8, it.side > 0 ? 0 : Math.PI, it.side > 0 ? Math.PI : 2 * Math.PI); ctx.fillStyle = it.flesh; ctx.fill(); }
  else { ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(-it.r * .35, -it.r * .35, it.r * .25, 0, 7); ctx.fill(); }
  ctx.restore();
}
function drawBomb(it) {
  ctx.fillStyle = '#1d1d1d'; ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, 7); ctx.fill();
  ctx.strokeStyle = '#ef6f6c'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(it.x, it.y, it.r - 5, 0, 7); ctx.stroke();
  ctx.fillStyle = '#8d8a8a'; ctx.fillRect(it.x - 4, it.y - it.r - 6, 8, 8);
  ctx.fillStyle = Math.floor(performance.now() / 80) % 2 ? '#f2b544' : '#ef6f6c';
  ctx.beginPath(); ctx.arc(it.x + 4, it.y - it.r - 9, 4, 0, 7); ctx.fill();
}
function draw() {
  ctx.fillStyle = '#5a3d2b'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#634433';
  for (let x = 0; x < W; x += 80) ctx.fillRect(x, 0, 4, H);
  if (!items) return;
  for (const h of halves) drawFruit(h, true);
  for (const it of items) it.bomb ? drawBomb(it) : drawFruit(it, false);
  for (const d of drops) { ctx.globalAlpha = d.life * 2; ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(d.x, d.y, 3, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  if (trail.length > 1) {
    ctx.strokeStyle = '#eef3e6'; ctx.lineCap = 'round';
    for (let i = 1; i < trail.length; i++) { ctx.lineWidth = i / trail.length * 8; ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke(); }
  }
  for (const x of texts) { ctx.globalAlpha = 1 - x.t; ctx.fillStyle = '#f2b544'; ctx.font = '28px "Lilita One", sans-serif'; ctx.textAlign = 'center'; ctx.fillText(x.text, x.x, x.y - x.t * 30); }
  ctx.globalAlpha = 1;
  if (boom > 0) { ctx.fillStyle = `rgba(255,255,255,${boom})`; ctx.fillRect(0, 0, W, H); boom -= .02; }
}

const pt = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H, time: performance.now() }; };
cv.addEventListener('pointerdown', e => { if (!playing) return; swiping = true; swipeCount = 0; lastPt = pt(e); trail = [lastPt]; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => {
  if (!swiping || !playing) return;
  const p = pt(e); slice(lastPt, p); lastPt = p; trail.push(p);
});
const stopSwipe = () => {
  if (swiping && playing && swipeCount >= 3) { score += swipeCount; hud(); texts.push({ text: `Combo +${swipeCount}`, x: lastPt.x, y: lastPt.y, t: 0 }); }
  swiping = false;
};
cv.addEventListener('pointerup', stopSwipe);
cv.addEventListener('pointercancel', stopSwipe);
$('go').onclick = start;
$('best').textContent = Best.get('fruit-slicer');
let last = performance.now();
function frame(now) {
  const dt = Math.min(.04, (now - last) / 1000); last = now;
  if (playing) step(dt);
  draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
