<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desert Commando</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  .top, .stage { max-width: 800px; }
  .board { max-width: 800px; }
  canvas { aspect-ratio: 16 / 9; }
  .touch { display: none; width: 100%; justify-content: space-between; gap: 12px; user-select: none; -webkit-user-select: none; }
  .touch div { display: flex; gap: 8px; }
  .touch button { width: 64px; height: 56px; padding: 0; font-size: 15px; touch-action: none; }
  .touch button.on { background: #22433c; border-color: var(--gold); }
  @media (pointer: coarse) { .touch { display: flex; } .keys { display: none; } }
</style>
</head>
<body>
<header class="top">
  <a class="back" href="../index.html">← Library</a>
  <h1>Desert Commando</h1>
  <div class="stats">
    <div class="stat"><small>Score</small><b id="score">0</b></div>
    <div class="stat"><small>Best</small><b id="best">0</b></div>
  </div>
</header>
<main class="stage">
  <div class="board">
    <canvas id="c" width="640" height="360" aria-label="Desert Commando"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">Desert Commando</h2>
      <p id="ov-text">Fight through the desert, free the prisoners for power-ups, and destroy the giant tank at the end.</p>
      <button class="primary" id="go">Start mission</button>
    </div>
  </div>
  <div class="touch" id="touch">
    <div><button data-c="left" aria-label="Left">◀</button><button data-c="right" aria-label="Right">▶</button></div>
    <div><button data-c="bomb">Bomb</button><button data-c="jump">Jump</button><button data-c="fire">Fire</button></div>
  </div>
  <p class="hint keys">Move: ← → or A D · Jump: Space or ↑ · Shoot: J or X (hold) · Grenade: K or C</p>
</main>
<script src="shared.js"></script>
<script>
const W = 640, H = 360, GY = 300, ARENA = 4600, LEVEL_END = ARENA + W, GRAV = 1800;
const cv = document.getElementById('c'), ctx = cv.getContext('2d'), $ = id => document.getElementById(id);

// ---------- Level ----------
const CRATES = [[600, 264], [1150, 264], [1186, 228], [1186, 264], [1222, 264], [2050, 264], [2086, 264], [2086, 228], [3300, 264], [3336, 264], [3336, 228], [3372, 264], [3372, 228], [3372, 192], [4100, 264]];
const LEDGES = [[1450, 215, 180], [1750, 180, 140], [2500, 215, 200], [2900, 200, 160], [3700, 210, 200], [4000, 170, 140]];
// Things you can stand on: crate tops and ledges (one-way, from above).
const PLATS = [
  ...CRATES.map(([x, y]) => ({ x, y, w: 36 })),
  ...LEDGES.map(([x, y, w]) => ({ x, y, w })),
];
const ENEMIES = [
  ['soldier', 800], ['soldier', 1000], ['knifer', 1250], ['soldier', 1300], ['soldier', 1540, 215], ['turret', 1650], ['soldier', 1820, 180],
  ['knifer', 1900], ['soldier', 2200], ['soldier', 2400], ['soldier', 2600, 215], ['knifer', 2700], ['turret', 2800], ['soldier', 2980, 200],
  ['soldier', 3200], ['knifer', 3400], ['soldier', 3500], ['soldier', 3800, 210], ['turret', 3950], ['soldier', 4060, 170],
  ['soldier', 4200], ['knifer', 4300], ['soldier', 4400],
];
const HOSTAGES = [[1380, 'H'], [2350, 'B'], [3600, 'H'], [4250, 'B']];
const KIND = {
  soldier: { w: 22, h: 40, hp: 2, points: 100 },
  knifer: { w: 22, h: 40, hp: 1, points: 150 },
  turret: { w: 44, h: 34, hp: 7, points: 300 },
};

// ---------- State ----------
let S, ctrl = { left: false, right: false, jump: false, fire: false, bomb: false }, prev = {};

function newGame() {
  S = {
    p: { x: 80, y: GY, vx: 0, vy: 0, dir: 1, onGround: true, hp: 3, lives: 2, inv: 1, weapon: 'pistol', ammo: 0, bombs: 10, fireT: 0, step: 0 },
    camX: 0, bullets: [], shots: [], grenades: [], shells: [], fx: [], items: [], score: 0, shake: 0, t: 0,
    enemies: ENEMIES.map(([type, x, y = GY]) => {
      const ledge = PLATS.find(pl => y !== GY && pl.y === y && x >= pl.x && x <= pl.x + pl.w);
      return { type, x, y, ...KIND[type], dir: -1, t: 1 + Math.random(), active: false, dead: false, burst: 0, hitT: 0,
        minX: ledge ? ledge.x + 12 : x - 380, maxX: ledge ? ledge.x + ledge.w - 12 : x + 120 };
    }),
    hostages: HOSTAGES.map(([x, item]) => ({ x, item, freed: false, t: 0 })),
    boss: null, bossMode: false, warnT: 0, state: 'play', endT: 0,
  };
  $('overlay').hidden = true; hud();
}
function hud() { $('score').textContent = S.score; }
const overlap = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
console.assert(overlap(0, 0, 10, 10, 5, 5, 10, 10) && !overlap(0, 0, 10, 10, 20, 0, 5, 5), 'box overlap');

// ---------- Effects ----------
function boom(x, y, size) {
  S.fx.push({ kind: 'ring', x, y, r: size, life: .35, max: .35 });
  for (let i = 0; i < size / 3; i++) S.fx.push({ kind: 'spark', x, y, vx: (Math.random() - .5) * size * 12, vy: -Math.random() * size * 10, life: .6, max: .6, color: Math.random() < .5 ? '#f2b544' : '#ef6f6c' });
  for (let i = 0; i < 4; i++) S.fx.push({ kind: 'smoke', x: x + (Math.random() - .5) * size, y: y - Math.random() * size / 2, vx: 0, vy: -30, life: 1, max: 1, r: size / 3 });
  S.shake = Math.max(S.shake, size / 5);
}
function popText(x, y, text) { S.fx.push({ kind: 'text', x, y, text, life: .9, max: .9 }); }

// ---------- Player ----------
function hurtPlayer() {
  const p = S.p;
  if (p.inv > 0 || S.state !== 'play') return;
  p.hp--; p.inv = 1.2; S.shake = 6;
  if (p.hp > 0) return;
  boom(p.x, p.y - 20, 30);
  if (p.lives <= 0) return gameOver();
  p.lives--; p.hp = 3; p.inv = 2.5; p.weapon = 'pistol'; p.ammo = 0;
  p.x = Math.max(S.camX + 60, p.x - 40); p.y = 0; p.vy = 0;
}
function updatePlayer(dt) {
  const p = S.p;
  p.inv = Math.max(0, p.inv - dt);
  p.vx = (ctrl.right - ctrl.left) * 175;
  if (p.vx) p.dir = Math.sign(p.vx);
  if (ctrl.jump && !prev.jump && p.onGround) { p.vy = -640; p.onGround = false; }
  const oldY = p.y;
  p.vy += GRAV * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  p.onGround = false;
  if (p.y >= GY) { p.y = GY; p.vy = 0; p.onGround = true; }
  else if (p.vy >= 0) for (const pl of PLATS) {
    if (oldY <= pl.y && p.y >= pl.y && p.x + 8 > pl.x && p.x - 8 < pl.x + pl.w) { p.y = pl.y; p.vy = 0; p.onGround = true; break; }
  }
  const left = S.bossMode ? ARENA + 12 : S.camX + 12, right = S.bossMode ? ARENA + W - 12 : LEVEL_END - 12;
  p.x = Math.max(left, Math.min(right, p.x));
  p.step += Math.abs(p.vx) * dt;

  p.fireT -= dt;
  if (ctrl.fire && p.fireT <= 0) {
    const heavy = p.weapon === 'heavy';
    p.fireT = heavy ? .08 : .26;
    S.bullets.push({ x: p.x + p.dir * 18, y: p.y - 25 + (heavy ? (Math.random() - .5) * 6 : 0), vx: p.dir * 640, vy: heavy ? (Math.random() - .5) * 40 : 0, life: .9 });
    S.fx.push({ kind: 'flash', x: p.x + p.dir * 22, y: p.y - 25, life: .05, max: .05 });
    if (heavy && --p.ammo <= 0) p.weapon = 'pistol';
  }
  if (ctrl.bomb && !prev.bomb && p.bombs > 0) {
    p.bombs--;
    S.grenades.push({ x: p.x, y: p.y - 30, vx: p.dir * 280 + p.vx * .4, vy: -420, spin: 0 });
  }
}

// ---------- Enemies ----------
function enemyShoot(x, y, speed) {
  const p = S.p, dx = p.x - x, dy = (p.y - 22) - y, d = Math.hypot(dx, dy) || 1;
  S.shots.push({ x, y, vx: dx / d * speed, vy: dy / d * speed, life: 3 });
}
function updateEnemy(e, dt) {
  const p = S.p, dx = p.x - e.x, adx = Math.abs(dx);
  e.hitT = Math.max(0, e.hitT - dt);
  if (e.type === 'soldier') {
    if (adx > 420) return;
    e.dir = Math.sign(dx) || -1;
    if (adx > 230) e.x += e.dir * 55 * dt;
    e.x = Math.max(e.minX, Math.min(e.maxX, e.x));
    e.t -= dt;
    if (e.t <= 0) { e.t = 1.3 + Math.random() * .9; enemyShoot(e.x + e.dir * 16, e.y - 26, 250); }
  } else if (e.type === 'knifer') {
    if (adx > 330) return;
    e.dir = Math.sign(dx) || -1;
    e.t -= dt;
    if (e.t <= 0) e.x += e.dir * 165 * dt;
    e.x = Math.max(e.minX, Math.min(e.maxX, e.x));
    if (adx < 20 && Math.abs(p.y - e.y) < 30 && e.t <= 0) { hurtPlayer(); e.t = 1; e.x -= e.dir * 30; }
  } else if (e.type === 'turret') {
    e.dir = Math.sign(dx) || -1;
    if (adx > 500) return;
    e.t -= dt;
    if (e.t <= 0) { e.burst = 3; e.t = 2.4; }
    if (e.burst > 0 && e.t < 2.4 - (3 - e.burst) * .15) { e.burst--; enemyShoot(e.x + e.dir * 26, e.y - 24, 300); }
  }
}
function damageEnemy(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg; e.hitT = .08;
  if (e.hp > 0) return;
  e.dead = true; S.score += e.points; hud();
  popText(e.x, e.y - e.h - 6, '+' + e.points);
  boom(e.x, e.y - e.h / 2, e.type === 'turret' ? 36 : 18);
}

// ---------- Boss ----------
function startBoss() {
  S.bossMode = true; S.warnT = 2.2;
  S.boss = { x: ARENA + 520, y: GY, w: 150, h: 92, hp: 70, max: 70, dir: -1, shellT: 2.5, mgT: 4.5, mg: 0, hitT: 0, dead: false };
}
function updateBoss(dt) {
  const b = S.boss, p = S.p;
  if (!b || b.dead) return;
  b.hitT = Math.max(0, b.hitT - dt);
  b.x += b.dir * 40 * dt;
  if (b.x < ARENA + 330) b.dir = 1; if (b.x > ARENA + 560) b.dir = -1;
  if (S.warnT > 0) return;
  const rage = b.hp < b.max / 2 ? .7 : 1;
  b.shellT -= dt;
  if (b.shellT <= 0) {
    b.shellT = 2.6 * rage;
    // Lob a shell that lands where the player stands now.
    const sx = b.x - 80, sy = b.y - 82, T = 1.1, g = 900;
    S.shells.push({ x: sx, y: sy, vx: (p.x - sx) / T, vy: (p.y - sy - .5 * g * T * T) / T, g });
    S.fx.push({ kind: 'flash', x: sx, y: sy, life: .1, max: .1 });
  }
  b.mgT -= dt;
  if (b.mgT <= 0) { b.mgT = 4.5 * rage; b.mg = 7; b.mgNext = 0; }
  if (b.mg > 0) {
    b.mgNext -= dt;
    if (b.mgNext <= 0) { b.mg--; b.mgNext = .11; S.shots.push({ x: b.x - 76, y: b.y - 18, vx: -360, vy: 0, life: 3 }); }
  }
  if (overlap(p.x - 11, p.y - 40, 22, 40, b.x - b.w / 2, b.y - b.h, b.w, b.h)) { hurtPlayer(); p.x = b.x - b.w / 2 - 20; }
}
function damageBoss(dmg) {
  const b = S.boss;
  if (!b || b.dead || S.warnT > 0) return;
  b.hp -= dmg; b.hitT = .06;
  if (b.hp > 0) return;
  b.dead = true; S.state = 'won'; S.endT = 2.4;
  S.score += 5000 + S.p.lives * 1000; hud();
}

// ---------- Main update ----------
function update(dt) {
  S.t += dt;
  const p = S.p;
  if (S.state === 'play') updatePlayer(dt);

  if (!S.bossMode) {
    S.camX = Math.max(S.camX, Math.min(p.x - W * .4, ARENA));
    if (p.x > ARENA + 120) startBoss();
  } else S.camX += (ARENA - S.camX) * Math.min(1, dt * 4);
  if (S.warnT > 0) S.warnT -= dt;

  for (const e of S.enemies) {
    if (e.dead) continue;
    if (!e.active && e.x < S.camX + W + 40) e.active = true;
    if (e.active && S.state === 'play') updateEnemy(e, dt);
  }
  if (S.state === 'play') updateBoss(dt);

  for (const h of S.hostages) {
    if (!h.freed && Math.abs(p.x - h.x) < 18 && Math.abs(p.y - GY) < 4) {
      h.freed = true; S.score += 500; hud(); popText(h.x, GY - 50, 'Thank you! +500');
      S.items.push({ kind: h.item, x: h.x + 20, y: GY - 40, vy: -200 });
    }
    if (h.freed) { h.t += dt; h.x -= 120 * dt; }
  }
  for (const it of S.items) {
    it.vy += GRAV * dt; it.y = Math.min(GY, it.y + it.vy * dt);
    if (!it.taken && Math.abs(p.x - it.x) < 22 && Math.abs(p.y - it.y) < 40) {
      it.taken = true;
      if (it.kind === 'H') { p.weapon = 'heavy'; p.ammo = 150; popText(it.x, it.y - 30, 'Heavy gun!'); }
      else { p.bombs += 10; popText(it.x, it.y - 30, '+10 grenades'); }
    }
  }
  S.items = S.items.filter(i => !i.taken);

  for (const b of S.bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (const e of S.enemies) {
      if (!e.active || e.dead || !overlap(b.x - 3, b.y - 2, 6, 4, e.x - e.w / 2, e.y - e.h, e.w, e.h)) continue;
      damageEnemy(e, 1); b.life = 0; break;
    }
    const bo = S.boss;
    if (b.life > 0 && bo && !bo.dead && overlap(b.x - 3, b.y - 2, 6, 4, bo.x - bo.w / 2, bo.y - bo.h, bo.w, bo.h)) { damageBoss(1); b.life = 0; }
    if (b.x < S.camX - 20 || b.x > S.camX + W + 20) b.life = 0;
  }
  S.bullets = S.bullets.filter(b => b.life > 0);

  for (const s of S.shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.y > GY) s.life = 0;
    if (overlap(s.x - 3, s.y - 3, 6, 6, p.x - 9, p.y - 38, 18, 38)) { s.life = 0; hurtPlayer(); }
  }
  S.shots = S.shots.filter(s => s.life > 0);

  const explode = (x, y, r, dmg) => {
    boom(x, y, r);
    for (const e of S.enemies) if (e.active && !e.dead && Math.abs(e.x - x) < r + e.w / 2 && Math.abs(e.y - e.h / 2 - y) < r + e.h / 2) damageEnemy(e, dmg);
    const bo = S.boss;
    if (dmg && bo && !bo.dead && Math.abs(bo.x - x) < r + bo.w / 2 && y > bo.y - bo.h - r) damageBoss(dmg);
  };
  for (const g of S.grenades) {
    g.vy += 1200 * dt; g.x += g.vx * dt; g.y += g.vy * dt; g.spin += dt * 12;
    const hitEnemy = S.enemies.some(e => e.active && !e.dead && overlap(g.x - 4, g.y - 4, 8, 8, e.x - e.w / 2, e.y - e.h, e.w, e.h));
    const hitBoss = S.boss && !S.boss.dead && overlap(g.x - 4, g.y - 4, 8, 8, S.boss.x - S.boss.w / 2, S.boss.y - S.boss.h, S.boss.w, S.boss.h);
    if (g.y >= GY || hitEnemy || hitBoss) { g.done = true; explode(g.x, Math.min(g.y, GY - 10), 48, 6); }
  }
  S.grenades = S.grenades.filter(g => !g.done);
  for (const s of S.shells) {
    s.vy += s.g * dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.y >= GY) {
      s.done = true; boom(s.x, GY - 8, 40);
      if (Math.abs(p.x - s.x) < 44 && p.y > GY - 60) hurtPlayer();
    }
  }
  S.shells = S.shells.filter(s => !s.done);

  for (const f of S.fx) {
    f.life -= dt;
    if (f.vx !== undefined) { f.x += f.vx * dt; f.y += f.vy * dt; if (f.kind === 'spark') f.vy += 900 * dt; }
  }
  S.fx = S.fx.filter(f => f.life > 0);
  S.shake = Math.max(0, S.shake - dt * 20);

  if (S.state === 'won') {
    S.endT -= dt;
    if (Math.random() < .25) boom(S.boss.x + (Math.random() - .5) * 140, S.boss.y - Math.random() * 80, 30);
    if (S.endT <= 0) finish(true);
  }
  prev = { ...ctrl };
}
function gameOver() { S.state = 'over'; setTimeout(() => finish(false), 900); }
function finish(won) {
  if (S.state === 'done') return;
  S.state = 'done';
  const record = Best.save('desert-commando', S.score); $('best').textContent = Best.get('desert-commando');
  $('ov-title').textContent = won ? 'Mission complete!' : 'Mission failed';
  $('ov-text').textContent = `Score: ${S.score}.${record && S.score ? ' New best!' : ''}`;
  $('go').textContent = won ? 'Play again' : 'Try again';
  $('overlay').hidden = false;
}

// ---------- Drawing ----------
function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, GY);
  sky.addColorStop(0, '#f2a65a'); sky.addColorStop(.6, '#f7d08a'); sky.addColorStop(1, '#f4e3b5');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff2c4'; ctx.beginPath(); ctx.arc(500, 80, 34, 0, 7); ctx.fill();
  const cam = S ? S.camX : 0;
  // Far dunes
  ctx.fillStyle = '#e2b77a'; ctx.beginPath(); ctx.moveTo(0, GY);
  for (let x = 0; x <= W; x += 10) ctx.lineTo(x, 210 + Math.sin((x + cam * .15) / 90) * 18 + Math.sin((x + cam * .15) / 37) * 6);
  ctx.lineTo(W, GY); ctx.fill();
  // Ruined buildings
  ctx.fillStyle = '#b98a5a';
  for (let i = 0; i < 30; i++) {
    const bx = i * 230 - cam * .45, w = 60 + (i * 37) % 50, h = 50 + (i * 53) % 70;
    if (bx < -w || bx > W) continue;
    ctx.fillRect(bx, GY - h, w, h);
    ctx.fillStyle = '#9c714a';
    for (let wy = GY - h + 12; wy < GY - 14; wy += 22) for (let wx = bx + 10; wx < bx + w - 14; wx += 20) ctx.fillRect(wx, wy, 8, 10);
    ctx.fillStyle = '#b98a5a';
  }
  // Ground
  ctx.fillStyle = '#d9a866'; ctx.fillRect(0, GY, W, H - GY);
  ctx.fillStyle = '#c4904f'; ctx.fillRect(0, GY, W, 5);
  ctx.fillStyle = '#c99858';
  for (let i = 0; i < 40; i++) { const x = ((i * 113 - cam) % (W + 40) + W + 40) % (W + 40) - 20; ctx.fillRect(x, GY + 14 + (i * 7) % 40, 10, 3); }
}
function drawSoldier(x, y, dir, uniform, skin, step, opts = {}) {
  ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.scale(dir, 1);
  const leg = Math.sin(step / 8) * 6 * (opts.moving ? 1 : 0);
  ctx.fillStyle = '#3a3226'; ctx.fillRect(-7 + leg, -14, 6, 14); ctx.fillRect(1 - leg, -14, 6, 14);
  ctx.fillStyle = uniform; ctx.fillRect(-9, -32, 18, 19);
  ctx.fillStyle = skin; ctx.fillRect(-6, -41, 12, 10);
  ctx.fillStyle = opts.helmet || uniform; ctx.beginPath(); ctx.arc(0, -40, 8, Math.PI, 0); ctx.fill(); ctx.fillRect(-9, -41, 18, 3);
  ctx.fillStyle = '#1d1d1d'; ctx.fillRect(2, -38, 2, 2);
  if (opts.knife) { ctx.fillStyle = '#d8dde0'; ctx.fillRect(8, -26, 10, 3); }
  else { ctx.fillStyle = '#2b2b2b'; ctx.fillRect(4, -27, opts.heavy ? 22 : 16, opts.heavy ? 6 : 4); }
  ctx.fillStyle = skin; ctx.fillRect(4, -25, 5, 5);
  ctx.restore();
}
function drawTurret(e) {
  ctx.fillStyle = '#c9b48e';
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(e.x - 14 + i * 14, e.y - 8, 9, 7, 0, 0, 7); ctx.fill(); }
  ctx.beginPath(); ctx.ellipse(e.x - 7, e.y - 19, 9, 7, 0, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(e.x + 7, e.y - 19, 9, 7, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#8a3b2b'; ctx.fillRect(e.x - 7, e.y - 36, 14, 12);
  ctx.fillStyle = '#e8c39e'; ctx.fillRect(e.x - 4, e.y - 42, 8, 7);
  ctx.fillStyle = '#2b2b2b'; ctx.fillRect(e.dir > 0 ? e.x : e.x - 26, e.y - 28, 26, 5);
}
function drawBoss(b) {
  const x = b.x, y = b.y;
  ctx.save(); if (b.hitT > 0) ctx.globalAlpha = .6;
  ctx.fillStyle = '#3a3a34'; ctx.beginPath(); ctx.roundRect(x - 78, y - 26, 156, 26, 13); ctx.fill();
  ctx.fillStyle = '#5a5a50';
  for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.arc(x - 62 + i * 21, y - 13, 8, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#7a4a3a'; ctx.fillRect(x - 74, y - 58, 148, 32);
  ctx.fillStyle = '#8f5a45'; ctx.fillRect(x - 50, y - 86, 92, 30);
  ctx.fillStyle = '#2b2b2b'; ctx.fillRect(x - 120, y - 76, 72, 10); ctx.fillRect(x - 96, y - 24, 22, 7);
  ctx.fillStyle = '#ef6f6c'; ctx.beginPath(); ctx.arc(x + 10, y - 72, 6, 0, 7); ctx.fill();
  ctx.fillStyle = '#5a3a2b'; for (let i = 0; i < 5; i++) ctx.fillRect(x - 66 + i * 30, y - 50, 18, 4);
  ctx.restore();
}
function drawWorld() {
  const p = S.p;
  ctx.save(); ctx.translate(-Math.round(S.camX), 0);
  for (const [x, y] of CRATES) {
    ctx.fillStyle = '#9c6b3c'; ctx.fillRect(x, y, 36, 36);
    ctx.strokeStyle = '#6e4826'; ctx.lineWidth = 3; ctx.strokeRect(x + 1.5, y + 1.5, 33, 33);
    ctx.beginPath(); ctx.moveTo(x + 3, y + 3); ctx.lineTo(x + 33, y + 33); ctx.stroke();
  }
  for (const [x, y, w] of LEDGES) {
    ctx.fillStyle = '#6b6f73'; ctx.fillRect(x, y, w, 10);
    ctx.fillStyle = '#4e5256'; for (let i = x + 6; i < x + w - 6; i += 24) ctx.fillRect(i, y + 10, 6, GY - y - 10);
    ctx.fillStyle = '#8a8f94'; ctx.fillRect(x, y, w, 3);
  }
  for (const h of S.hostages) {
    if (h.t > 1.5) continue;
    ctx.globalAlpha = h.freed ? Math.max(0, 1 - h.t / 1.5) : 1;
    if (h.freed) drawSoldier(h.x, GY, -1, '#e8e0c8', '#e8c39e', S.t * 200, { moving: true, helmet: '#d9b38c', knife: true });
    else {
      ctx.fillStyle = '#e8e0c8'; ctx.fillRect(h.x - 10, GY - 22, 20, 16);
      ctx.fillStyle = '#e8c39e'; ctx.fillRect(h.x - 5, GY - 32, 10, 10);
      ctx.fillStyle = '#8a5a3b'; ctx.fillRect(h.x - 11, GY - 16, 22, 3);
      ctx.fillStyle = '#ef6f6c'; ctx.font = '12px "Lilita One", sans-serif'; ctx.textAlign = 'center';
      if (Math.floor(S.t * 2) % 2) ctx.fillText('HELP!', h.x, GY - 40);
    }
    ctx.globalAlpha = 1;
  }
  for (const it of S.items) {
    ctx.fillStyle = it.kind === 'H' ? '#ef6f6c' : '#5aa9e6'; ctx.beginPath(); ctx.roundRect(it.x - 10, it.y - 20, 20, 20, 4); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '14px "Lilita One", sans-serif'; ctx.textAlign = 'center'; ctx.fillText(it.kind, it.x, it.y - 5);
  }
  for (const e of S.enemies) {
    if (!e.active || e.dead) continue;
    if (e.hitT > 0) ctx.globalAlpha = .5;
    if (e.type === 'turret') drawTurret(e);
    else drawSoldier(e.x, e.y, e.dir, e.type === 'knifer' ? '#a34a3a' : '#c0573f', '#e8c39e', e.x, { moving: e.type === 'knifer' && Math.abs(S.p.x - e.x) < 330, helmet: '#7a3a2b', knife: e.type === 'knifer' });
    ctx.globalAlpha = 1;
  }
  if (S.boss && (!S.boss.dead || S.endT > 1)) drawBoss(S.boss);
  if (S.state !== 'over' && S.state !== 'done' && (p.inv <= 0 || Math.floor(S.t * 12) % 2)) {
    drawSoldier(p.x, p.y, p.dir, '#5d7a3a', '#e8c39e', p.step, { moving: p.vx !== 0 && p.onGround, helmet: '#4a6330', heavy: p.weapon === 'heavy' });
  }
  ctx.fillStyle = '#fff2a8'; for (const b of S.bullets) ctx.fillRect(b.x - 5, b.y - 1.5, 10, 3);
  ctx.fillStyle = '#ef6f6c'; for (const s of S.shots) { ctx.beginPath(); ctx.arc(s.x, s.y, 3.5, 0, 7); ctx.fill(); }
  for (const g of S.grenades) { ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.spin); ctx.fillStyle = '#4a6330'; ctx.fillRect(-4, -5, 8, 10); ctx.restore(); }
  ctx.fillStyle = '#2b2b2b'; for (const s of S.shells) { ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, 7); ctx.fill(); }
  for (const f of S.fx) {
    const k = f.life / f.max;
    ctx.globalAlpha = Math.min(1, k * 1.5);
    if (f.kind === 'ring') { ctx.fillStyle = '#f2b544'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.2 - k * .7), 0, 7); ctx.fill(); ctx.fillStyle = '#fff2c4'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 - k) * .6, 0, 7); ctx.fill(); }
    if (f.kind === 'spark') { ctx.fillStyle = f.color; ctx.fillRect(f.x, f.y, 3, 3); }
    if (f.kind === 'smoke') { ctx.fillStyle = 'rgba(80,70,60,.5)'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1.5 - k), 0, 7); ctx.fill(); }
    if (f.kind === 'flash') { ctx.fillStyle = '#fff2a8'; ctx.beginPath(); ctx.arc(f.x, f.y, 7, 0, 7); ctx.fill(); }
    if (f.kind === 'text') { ctx.fillStyle = '#fff'; ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 3; ctx.font = '15px "Lilita One", sans-serif'; ctx.textAlign = 'center'; ctx.strokeText(f.text, f.x, f.y - (1 - k) * 24); ctx.fillText(f.text, f.x, f.y - (1 - k) * 24); }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawHud() {
  const p = S.p;
  ctx.fillStyle = 'rgba(16,35,31,.65)'; ctx.beginPath(); ctx.roundRect(8, 8, 240, 30, 8); ctx.fill();
  for (let i = 0; i < 3; i++) { ctx.fillStyle = i < p.hp ? '#ef6f6c' : '#4a3a3a'; ctx.beginPath(); ctx.arc(24 + i * 18, 23, 6, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#eef3e6'; ctx.font = '14px "Lilita One", sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(`x${p.lives}`, 76, 28);
  ctx.fillText(p.weapon === 'heavy' ? `HEAVY ${p.ammo}` : 'PISTOL ∞', 104, 28);
  ctx.fillText(`B ${p.bombs}`, 204, 28);
  if (S.boss && !S.boss.dead) {
    ctx.fillStyle = 'rgba(16,35,31,.65)'; ctx.fillRect(W / 2 - 122, H - 30, 244, 18);
    ctx.fillStyle = '#ef6f6c'; ctx.fillRect(W / 2 - 118, H - 26, 236 * S.boss.hp / S.boss.max, 10);
  }
  if (S.warnT > 0 && Math.floor(S.warnT * 4) % 2) {
    ctx.fillStyle = '#ef6f6c'; ctx.font = '44px "Lilita One", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('WARNING!', W / 2, H / 2 - 20);
  }
  if (!S.bossMode && S.camX < 40) { ctx.fillStyle = '#3a2a1a'; ctx.font = '18px "Lilita One", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('GO! →', W / 2, 70); }
}
function draw() {
  ctx.save();
  if (S && S.shake) ctx.translate((Math.random() - .5) * S.shake, (Math.random() - .5) * S.shake);
  drawBackground();
  if (S) { drawWorld(); drawHud(); }
  ctx.restore();
}

// ---------- Input ----------
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyJ: 'fire', KeyX: 'fire', KeyK: 'bomb', KeyC: 'bomb' };
addEventListener('keydown', e => { const c = KEYMAP[e.code]; if (c) { e.preventDefault(); ctrl[c] = true; } });
addEventListener('keyup', e => { const c = KEYMAP[e.code]; if (c) ctrl[c] = false; });
addEventListener('blur', () => { for (const k in ctrl) ctrl[k] = false; });
document.querySelectorAll('#touch button').forEach(b => {
  const c = b.dataset.c, set = v => { ctrl[c] = v; b.classList.toggle('on', v); };
  b.addEventListener('pointerdown', e => { e.preventDefault(); b.setPointerCapture(e.pointerId); set(true); });
  b.addEventListener('pointerup', () => set(false));
  b.addEventListener('pointercancel', () => set(false));
  b.addEventListener('contextmenu', e => e.preventDefault());
});
$('go').onclick = newGame;
$('best').textContent = Best.get('desert-commando');

let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (S && S.state !== 'done') update(dt);
  draw(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
