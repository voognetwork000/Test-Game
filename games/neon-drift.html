<style>

  .back { color: #7a6a9a; }
  .back:hover { color: #00e5ff; text-shadow: 0 0 12px rgba(0, 229, 255, .7); }
  .stat small { color: #6f5f90; }
  .stage { max-width: 940px; }
  .screen {
    position: relative; width: 100%; border-radius: 16px; overflow: hidden;
    background: #05030e;
    border: 1px solid rgba(255, 45, 149, .32);
    box-shadow: 0 0 0 1px rgba(0, 229, 255, .10), 0 0 60px rgba(255, 45, 149, .22),
                0 0 140px rgba(0, 229, 255, .10), inset 0 0 90px rgba(0, 0, 0, .85);
  }

  .hud { position: absolute; inset: 0; pointer-events: none; font-family: 'Orbitron', sans-serif; }
  .hud .tl { position: absolute; left: 20px; top: 16px; }
  .hud .tr { position: absolute; right: 20px; top: 16px; text-align: right; }

              text-shadow: 0 0 14px rgba(0, 229, 255, .85), 0 0 34px rgba(0, 229, 255, .35); font-variant-numeric: tabular-nums; }
  .hud .tr .val { font-size: 26px; color: #ffd6ec; text-shadow: 0 0 14px rgba(255, 45, 149, .9), 0 0 34px rgba(255, 45, 149, .4); }
  .hud .tr .val small { font-size: 11px; letter-spacing: 2px; color: #8f7bb5; }
  .boostwrap { position: absolute; left: 20px; bottom: 18px; width: 190px; }
  .boostwrap .lbl { margin-bottom: 5px; }
  .bar { height: 8px; border-radius: 6px; background: rgba(255, 255, 255, .07); overflow: hidden;
         box-shadow: inset 0 0 0 1px rgba(0, 229, 255, .18); }

           background: linear-gradient(90deg, #00e5ff, #7b5cff 55%, #ff2d95);

  .pips { position: absolute; right: 20px; bottom: 18px; display: flex; gap: 8px; }
  .pip { width: 20px; height: 20px; transform: rotate(45deg); border-radius: 4px;
         background: linear-gradient(135deg, #ff2d95, #ff9d00);
         box-shadow: 0 0 14px rgba(255, 45, 149, .9), inset 0 0 6px rgba(255, 255, 255, .5); transition: .2s; }
  .pip.off { background: rgba(255, 255, 255, .08); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }
  .combo { position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
           font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 15px; letter-spacing: 3px;
           color: #ffd23f; text-shadow: 0 0 16px rgba(255, 210, 63, .9); opacity: 0; transition: opacity .2s; }
  .combo.on { opacity: 1; }
  .panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 6px; text-align: center; padding: 24px; z-index: 6; cursor: default;
           background: radial-gradient(circle at 50% 45%, rgba(20, 6, 40, .72), rgba(4, 2, 10, .94) 70%); }
  .logo { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(34px, 8vw, 74px); line-height: .88;
          letter-spacing: 6px; margin: 0;
          background: linear-gradient(180deg, #ffffff 4%, #8ff5ff 26%, #7b5cff 54%, #ff2d95 82%, #ff9d00 100%);
          -webkit-background-clip: text; background-clip: text; color: transparent;
          filter: drop-shadow(0 0 18px rgba(255, 45, 149, .65)) drop-shadow(0 0 44px rgba(0, 229, 255, .35)); }
  .logo span { display: block; }
  .sub { font-family: 'Rajdhani', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 2.5px;
         text-transform: uppercase; color: #9b86c4; margin: 12px 0 2px; }
  .keys { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; margin: 10px 0 4px;
          font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 600; color: #7f6ba8; letter-spacing: 1px; }
  .keys kbd { font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700; color: #bff4ff;
              background: rgba(0, 229, 255, .09); border: 1px solid rgba(0, 229, 255, .35);
              border-radius: 5px; padding: 3px 7px; margin-right: 5px; box-shadow: 0 0 12px rgba(0, 229, 255, .2); }
  .cta { margin-top: 16px; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 15px; letter-spacing: 3px;
         color: #04020a; background: linear-gradient(135deg, #00e5ff, #7b5cff 50%, #ff2d95);
         border: 0; border-radius: 10px; padding: 14px 34px; cursor: pointer;
         box-shadow: 0 0 30px rgba(0, 229, 255, .45), 0 0 70px rgba(255, 45, 149, .3), inset 0 -3px 0 rgba(0, 0, 0, .3);
         transition: transform .15s, box-shadow .15s; }
  .cta:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 0 40px rgba(0, 229, 255, .65), 0 0 90px rgba(255, 45, 149, .45); }
  .cta:active { transform: translateY(0) scale(.99); }
  .result { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(30px, 7vw, 56px); letter-spacing: 4px;
            background: linear-gradient(180deg, #ffffff, #8ff5ff 40%, #ff2d95);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 0 20px rgba(255, 45, 149, .6)); margin: 0; }
  .scoreline { font-family: 'Rajdhani', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 2px; color: #b6a3d9; margin: 8px 0 0; }
  .scoreline b { color: #fff; font-family: 'Orbitron', sans-serif; font-size: 22px; text-shadow: 0 0 16px rgba(0, 229, 255, .8); }
  .newbest { font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 4px; color: #ffd23f;
             text-shadow: 0 0 18px rgba(255, 210, 63, .9); margin-top: 10px; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (max-width: 520px) {
    .hud .val { font-size: 22px; } .hud .tr .val { font-size: 19px; }
    .boostwrap { width: 130px; } .pip { width: 15px; height: 15px; }
    .keys { font-size: 11px; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="back" href="../index.html">← Library</a>
  <h1>Neon Drift</h1>
  <div class="stats">
    <div class="stat"><small>Best</small><b id="bestTop">0</b></div>
  </div>
</header>
<main class="stage">
  <div class="screen">
    <canvas id="c" width="960" height="600" aria-label="Neon Drift — synthwave highway racer"></canvas>
    <div class="hud">
      <div class="tl"><div class="lbl">SCORE</div><div class="val" id="score">0</div></div>
      <div class="tr"><div class="lbl">SPEED</div><div class="val"><span id="speed">0</span><small> KM/H</small></div></div>
      <div class="combo" id="combo">COMBO ×1</div>
      <div class="boostwrap"><div class="lbl">BOOST</div><div class="bar"><i id="boostbar"></i></div></div>
      <div class="pips" id="pips"></div>
    </div>
    <div class="panel" id="panel">
      <h2 class="logo"><span>NEON</span><span>DRIFT</span></h2>
      <p class="sub" id="pSub">Chase the horizon · Dodge the traffic · Collect the light</p>
      <div class="keys" id="pKeys">
        <span><kbd>A</kbd><kbd>D</kbd> steer</span>
        <span><kbd>↑</kbd> boost</span>
        <span><kbd>↓</kbd> brake</span>
        <span><kbd>drag</kbd> on touch</span>
      </div>
      <button class="cta" id="pBtn">START ENGINE</button>
    </div>
  </div>
  <p class="hint" id="hint">Steer with A / D or the arrow keys. Hold ↑ or Space to burn boost. Collect orbs to refill it.</p>
</main>
<script src="shared.js"></script>
<script>
/* ============================================================
   NEON DRIFT — pseudo-3D synthwave highway racer
   Road is a projected segment strip (perspective divide),
   with hill elevation + curvature integral exactly like the
   classic OutRun renderers, repainted in a neon palette.
   ============================================================ */

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const W = cvs.width, H = cvs.height;
const $ = id => document.getElementById(id);

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, p) => a + (b - a) * p;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const easeIn = (a, b, p) => a + (b - a) * p * p;
const easeOut = (a, b, p) => a + (b - a) * (1 - Math.pow(1 - p, 2));
const easeInOut = (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5);
const pctRemaining = (n, total) => (n % total) / total;
function increase(start, inc, max) {
  let r = start + inc;
  while (r >= max) r -= max;
  while (r < 0) r += max;
  return r;
}
const expFog = (d, density) => 1 / Math.pow(Math.E, d * d * density);

/* ---------------- road geometry ---------------- */
const SEG = 200;          // length of one road segment
const RUMBLE = 3;         // segments per rumble stripe
const ROADW = 2000;       // half width of the road in world units
const LANES = 3;
const FOV = 100;
const CAMH = 1000;        // camera height
const DRAWD = 240;        // segments drawn
const FOGD = 5;
const CAMD = 1 / Math.tan((FOV / 2) * Math.PI / 180);
const PZ = CAMH * CAMD;   // camera -> player distance

const LEN = { SHORT: 25, MEDIUM: 50, LONG: 100 };
const HILL = { NONE: 0, LOW: 20, MEDIUM: 40, HIGH: 60 };
const CURVE = { NONE: 0, EASY: 2, MEDIUM: 4, HARD: 6 };

const HORIZON = '#2b0f45';
const PAL = {
  light: { road: '#1a1240', grass: '#120a28', rumble: '#ff2d95', lane: '#8ea4d8' },
  dark:  { road: '#150e35', grass: '#0c0619', rumble: '#00e5ff', lane: null },
};

let segments = [], trackLength = 0;

const lastY = () => segments.length ? segments[segments.length - 1].p2.world.y : 0;

function addSegment(curve, y) {
  const n = segments.length;
  segments.push({
    index: n, curve,
    p1: { world: { x: 0, y: lastY(), z: n * SEG }, camera: {}, screen: {} },
    p2: { world: { x: 0, y, z: (n + 1) * SEG }, camera: {}, screen: {} },
    clip: 0, fog: 1, looped: false,
    color: Math.floor(n / RUMBLE) % 2 ? PAL.dark : PAL.light,
  });
}
function addRoad(enter, hold, leave, curve, y) {
  const startY = lastY();
  const endY = startY + y * SEG;
  const total = enter + hold + leave;
  let n;
  for (n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(startY, endY, n / total));
  for (n = 0; n < hold; n++) addSegment(curve, easeInOut(startY, endY, (enter + n) / total));
  for (n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(startY, endY, (enter + hold + n) / total));
}
const addStraight = (n) => addRoad(n || LEN.MEDIUM, n || LEN.MEDIUM, n || LEN.MEDIUM, 0, 0);
const addHill = (n, h) => addRoad(n, n, n, 0, h);
const addCurve = (n, c, h) => addRoad(n, n, n, c, h || 0);
function addLowRollingHills(n, h) {
  n = n || LEN.SHORT; h = h || HILL.LOW;
  addRoad(n, n, n, 0, h / 2);
  addRoad(n, n, n, 0, -h);
  addRoad(n, n, n, CURVE.EASY, h);
  addRoad(n, n, n, 0, 0);
  addRoad(n, n, n, -CURVE.EASY, h / 2);
  addRoad(n, n, n, 0, 0);
}
function addSCurves() {
  addRoad(LEN.MEDIUM, LEN.MEDIUM, LEN.MEDIUM, -CURVE.EASY, HILL.NONE);
  addRoad(LEN.MEDIUM, LEN.MEDIUM, LEN.MEDIUM, CURVE.MEDIUM, HILL.MEDIUM);
  addRoad(LEN.MEDIUM, LEN.MEDIUM, LEN.MEDIUM, CURVE.EASY, -HILL.LOW);
  addRoad(LEN.MEDIUM, LEN.MEDIUM, LEN.MEDIUM, -CURVE.EASY, HILL.MEDIUM);
  addRoad(LEN.MEDIUM, LEN.MEDIUM, LEN.MEDIUM, -CURVE.MEDIUM, -HILL.MEDIUM);
}
function addBumps() {
  addRoad(10, 10, 10, 0, 5); addRoad(10, 10, 10, 0, -2); addRoad(10, 10, 10, 0, -5);
  addRoad(10, 10, 10, 0, 8); addRoad(10, 10, 10, 0, 5); addRoad(10, 10, 10, 0, -7);
  addRoad(10, 10, 10, 0, 5); addRoad(10, 10, 10, 0, -2);
}
function addDownhillToEnd(n) {
  n = n || 200;
  addRoad(n, n, n, -CURVE.EASY, -lastY() / SEG);
}
function buildTrack() {
  segments = [];
  addStraight(LEN.SHORT);
  addLowRollingHills();
  addSCurves();
  addCurve(LEN.MEDIUM, CURVE.MEDIUM, HILL.LOW);
  addBumps();
  addLowRollingHills();
  addCurve(LEN.LONG, CURVE.MEDIUM, HILL.MEDIUM);
  addStraight(LEN.MEDIUM);
  addHill(LEN.MEDIUM, HILL.HIGH);
  addSCurves();
  addCurve(LEN.LONG, -CURVE.MEDIUM, HILL.NONE);
  addHill(LEN.LONG, HILL.HIGH);
  addCurve(LEN.LONG, CURVE.MEDIUM, -HILL.LOW);
  addBumps();
  addHill(LEN.LONG, -HILL.MEDIUM);
  addStraight(LEN.MEDIUM);
  addSCurves();
  addDownhillToEnd();
  trackLength = segments.length * SEG;
}

/* ---------------- projection ---------------- */
function project(p, camX, camY, camZ) {
  p.camera.x = (p.world.x || 0) - camX;
  p.camera.y = (p.world.y || 0) - camY;
  p.camera.z = (p.world.z || 0) - camZ;
  if (p.camera.z < 1) p.camera.z = 1;
  p.screen.scale = CAMD / p.camera.z;
  p.screen.x = (W / 2) + (p.screen.scale * p.camera.x * W / 2);
  p.screen.y = (H / 2) - (p.screen.scale * p.camera.y * H / 2);
  p.screen.w = p.screen.scale * ROADW * W / 2;
}
const findSegment = z => segments[Math.floor(z / SEG) % segments.length];

/* ---------------- sky furniture (generated once) ---------------- */
function makeRidge(n, rough) {
  const a = []; let y = 0.55;
  for (let i = 0; i < n; i++) { y = clamp(y + rnd(-rough, rough) * 0.4, 0.16, 1); a.push(y); }
  a[n - 1] = a[0];
  return a;
}
const RIDGE_FAR = makeRidge(34, 0.55);
const RIDGE_NEAR = makeRidge(26, 0.85);

const STARS = Array.from({ length: 130 }, () => ({
  x: Math.random(), y: Math.random() * 0.46,
  r: rnd(0.6, 1.7), tw: rnd(0, 6.28), sp: rnd(0.6, 2.4),
  hue: Math.random() < 0.2 ? '#8ff5ff' : '#ffffff',
}));

const STREAKS = Array.from({ length: 34 }, () => ({
  a: Math.random() * Math.PI * 2,
  r: rnd(0.1, 1), sp: rnd(0.35, 1.1),
  len: rnd(0.05, 0.17), w: rnd(0.8, 2.2),
}));

const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.55);
skyGrad.addColorStop(0, '#04020c');
skyGrad.addColorStop(0.42, '#12082a');
skyGrad.addColorStop(0.74, '#260b3f');
skyGrad.addColorStop(1, HORIZON);

const SUN_R = 126;
const sunGrad = ctx.createLinearGradient(0, H / 2 - 132 - SUN_R, 0, H / 2 - 132 + SUN_R);
sunGrad.addColorStop(0, '#ffffff');
sunGrad.addColorStop(0.07, '#fff4b8');
sunGrad.addColorStop(0.17, '#ffd23f');
sunGrad.addColorStop(0.28, '#ff9a38');
sunGrad.addColorStop(0.39, '#ff3d7f');
sunGrad.addColorStop(0.52, '#cf1a86');
sunGrad.addColorStop(1, '#6b0f52');

/* ---------------- game state ---------------- */
const MAXSPEED = SEG / (1 / 60);
const CENTRIF = 0.30;
const STEER = 2.2;

let state = 'menu';
let position = 0, travel = 0, playerX = 0, speed = 0;
let score = 0, combo = 0, comboTimer = 0, boost = 0.4, shields = 3, invuln = 0;
let shake = 0, particles = [], objects = [], spawnTimer = 0;
let keys = Object.create(null), touchSteer = 0, lean = 0, bob = 0;
let lastT = 0, clock = 0;

const LANE_X = [-0.63, 0, 0.63];
const CAR_BODY = [
  ['#2f6fe0', '#7fc4ff'], ['#e04a8f', '#ff9ecb'], ['#e8b23a', '#ffe79a'],
  ['#43c98a', '#a6ffd4'], ['#8a5cf0', '#c7aaff'],
];

function resetGame() {
  position = 0; travel = 0; playerX = 0; speed = 6400;
  score = 0; combo = 0; comboTimer = 0; boost = 0.45; shields = 3; invuln = 0;
  shake = 0; particles = []; objects = []; spawnTimer = 0.7;
  lean = 0; bob = 0;
  updatePips();
  $('score').textContent = '0';
  $('combo').classList.remove('on');
}

/* ---------------- HUD ---------------- */
function updatePips() {
  $('pips').innerHTML = [0, 1, 2].map(i => `<div class="pip${i < shields ? '' : ' off'}"></div>`).join('');
}
let hudScore = -1, hudSpeed = -1, hudBoost = -1;
function syncHud() {
  const s = Math.floor(score);
  if (s !== hudScore) { hudScore = s; $('score').textContent = s.toLocaleString('en-US'); }
  const kmh = Math.round(speed / 46);
  if (kmh !== hudSpeed) { hudSpeed = kmh; $('speed').textContent = kmh; }
  const b = Math.round(boost * 100);
  if (b !== hudBoost) { hudBoost = b; $('boostbar').style.width = b + '%'; }
}

/* ---------------- particles ---------------- */
function burst(x, y, n, colors, power) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rnd(60, 420) * (power || 1);
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, decay: rnd(1.1, 2.4), size: rnd(1.5, 4.5),
      color: pick(colors),
    });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 480 * dt;
    p.vx *= 0.985; p.vy *= 0.985;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* ---------------- traffic & orbs ---------------- */
function spawn() {
  const z = travel + DRAWD * SEG * 0.9;
  const roll = Math.random();
  if (roll < 0.30) {
    // a ribbon of orbs down one lane
    const lane = pick(LANE_X);
    const count = 3 + ((Math.random() * 3) | 0);
    for (let i = 0; i < count; i++)
      objects.push({ kind: 'orb', z: z + i * SEG * 2.6, offset: lane, active: true, ph: rnd(0, 6.28), prevRel: null });
  } else if (roll < 0.88) {
    const [body, light] = pick(CAR_BODY);
    objects.push({ kind: 'car', z, offset: pick(LANE_X), active: true, body, light, prevRel: null });
  } else {
    // two cars side by side — leave exactly one gap
    const gap = (Math.random() * 3) | 0;
    for (let i = 0; i < 3; i++) {
      if (i === gap) continue;
      const [body, light] = pick(CAR_BODY);
      objects.push({ kind: 'car', z: z + rnd(-120, 120), offset: LANE_X[i], active: true, body, light, prevRel: null });
    }
  }
}

function hitCar() {
  if (invuln > 0) return;
  shields--; invuln = 1.5; shake = 1;
  speed *= 0.5;
  combo = 0; comboTimer = 0;
  burst(W / 2 + rnd(-90, 90), H * 0.76, 34, ['#ff2d95', '#ff9d00', '#ffffff'], 1.2);
  updatePips();
  if (shields <= 0) gameOver();
}
function collectOrb(o) {
  combo++; comboTimer = 3;
  const mult = 1 + Math.min(5, Math.floor(combo / 4));
  score += 45 * mult;
  boost = Math.min(1, boost + 0.085);
  const rel = o.z - travel;
  const p = projectPoint(o.offset, rel);
  if (p) burst(p.x, p.y, 16, ['#00e5ff', '#8ff5ff', '#ffffff'], 0.7);
  $('combo').textContent = 'COMBO ×' + mult;
  $('combo').classList.toggle('on', combo > 1);
}
// project a point on the road at a given lane offset / relative distance
function projectPoint(offset, rel) {
  const seg = findSegment(position + rel);
  if (!seg.p1.screen.scale) return null;
  const pct = ((position + rel) % SEG) / SEG;
  const sc = lerp(seg.p1.screen.scale, seg.p2.screen.scale, pct);
  const cx = lerp(seg.p1.screen.x, seg.p2.screen.x, pct);
  const cy = lerp(seg.p1.screen.y, seg.p2.screen.y, pct);
  const hw = sc * ROADW * W / 2;
  return { x: cx + offset * hw, y: cy, w: hw, scale: sc };
}

/* ---------------- update ---------------- */
function update(dt) {
  clock += dt;

  if (state === 'play') {
    const seg = findSegment(position + PZ);
    const speedPct = speed / MAXSPEED;

    // steering
    const dx = dt * STEER * Math.max(0.25, speedPct);
    let input = 0;
    if (keys.left) input -= 1;
    if (keys.right) input += 1;
    if (touchSteer) input = touchSteer;
    playerX += input * dx;
    // centrifugal drift on curves
    playerX -= dx * speedPct * seg.curve * CENTRIF;
    playerX = clamp(playerX, -1.12, 1.12);
    lean = lerp(lean, input + seg.curve * 0.06, Math.min(1, dt * 8));

    // throttle
    const base = 7200 + Math.min(5200, travel / 900);
    const boosting = (keys.up || keys.space) && boost > 0.02;
    let want = base;
    if (boosting) { want = base * 1.22 + 1400; boost = Math.max(0, boost - dt * 0.40); }
    if (keys.down) want = base * 0.42;
    // off-road drag
    if (Math.abs(playerX) > 0.97) { want *= 0.62; shake = Math.max(shake, 0.18); }
    speed += (want - speed) * Math.min(1, dt * 2.6);
    speed = clamp(speed, 900, MAXSPEED * 1.16);

    position = increase(position, speed * dt, trackLength);
    travel += speed * dt;
    score += speed * dt * 0.0055;

    // spawn
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawn();
      const pressure = 1 - Math.min(0.34, travel / 420000);
      spawnTimer = rnd(0.55, 0.95) * pressure;
    }

    // objects: cull, cross-plane tests
    for (const o of objects) {
      if (!o.active) continue;
      const rel = o.z - travel;
      if (rel < -900) { o.active = false; continue; }
      if (o.prevRel !== null && o.prevRel > PZ && rel <= PZ) {
        const close = Math.abs(playerX - o.offset) < 0.34;
        if (o.kind === 'car') { if (close) hitCar(); }
        else if (close) collectOrb(o);
      }
      o.prevRel = rel;
    }
    objects = objects.filter(o => o.active);

    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) { combo = 0; $('combo').classList.remove('on'); }
    }
    if (invuln > 0) invuln -= dt;

    bob += dt * (6 + speedPct * 10);
    if (boosting) {
      // exhaust sparks behind the car
      for (let i = 0; i < 2; i++)
        particles.push({
          x: W / 2 + rnd(-70, 70), y: H * 0.9,
          vx: rnd(-70, 70) + lean * -40, vy: rnd(-40, 140),
          life: 1, decay: 2.6, size: rnd(2, 5),
          color: pick(['#00e5ff', '#8ff5ff', '#7b5cff']),
        });
    }
    syncHud();
  } else {
    // idle demo drift behind the menu
    position = increase(position, 3400 * dt, trackLength);
    travel += 3400 * dt;
    playerX = Math.sin(clock * 0.5) * 0.34;
    bob += dt * 7;
  }

  shake = Math.max(0, shake - dt * 2.2);
  updateParticles(dt);
}

/* ---------------- rendering ---------------- */
function poly(x1, y1, x2, y2, x3, y3, x4, y4, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4);
  ctx.closePath(); ctx.fill();
}

function drawSky() {
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // stars
  for (const s of STARS) {
    const tw = 0.55 + 0.45 * Math.sin(clock * s.sp + s.tw);
    ctx.globalAlpha = tw * 0.95;
    ctx.fillStyle = s.hue;
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H * 1.05, s.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // horizon haze — sells the depth of the plane the road sits on
  ctx.globalCompositeOperation = 'lighter';
  const haze = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.72);
  haze.addColorStop(0, 'rgba(255, 45, 149, .26)');
  haze.addColorStop(0.34, 'rgba(180, 40, 160, .12)');
  haze.addColorStop(1, 'rgba(90, 20, 140, 0)');
  ctx.fillStyle = haze;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';

  // sun
  const sunX = W / 2 - playerX * 52;
  const sunY = H / 2 - 132;
  const sunR = SUN_R;

  ctx.globalCompositeOperation = 'lighter';
  const glow = ctx.createRadialGradient(sunX, sunY, sunR * 0.15, sunX, sunY, sunR * 3.4);
  glow.addColorStop(0, 'rgba(255, 190, 120, .55)');
  glow.addColorStop(0.28, 'rgba(255, 90, 160, .28)');
  glow.addColorStop(0.62, 'rgba(255, 45, 149, .10)');
  glow.addColorStop(1, 'rgba(255, 45, 149, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(sunX - sunR * 3.4, sunY - sunR * 3.4, sunR * 6.8, sunR * 6.8);
  ctx.globalCompositeOperation = 'source-over';

  ctx.save();
  ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI * 2); ctx.clip();
  const SLICES = 19;
  for (let i = 0; i < SLICES; i++) {
    const t0 = i / SLICES;
    let h = (1 / SLICES) * sunR * 2;
    if (t0 > 0.32) h *= 1 - Math.pow((t0 - 0.32) / 0.68, 1.1) * 0.88;
    ctx.fillStyle = sunGrad;
    ctx.fillRect(sunX - sunR, sunY - sunR + t0 * sunR * 2, sunR * 2, h + 0.6);
  }
  // vertical light bloom down the sun
  const bloom = ctx.createLinearGradient(0, sunY, 0, sunY + sunR);
  bloom.addColorStop(0, 'rgba(255,255,255,.22)');
  bloom.addColorStop(1, 'rgba(255,45,149,0)');
  ctx.fillStyle = bloom;
  ctx.fillRect(sunX - sunR, sunY, sunR * 2, sunR);
  ctx.restore();

  // mountain layers
  drawRidge(RIDGE_FAR, H / 2 + 4, 128, '#230e42', 'rgba(255, 45, 149, .55)', playerX * 34 + position * 0.004);
  drawRidge(RIDGE_NEAR, H / 2 + 8, 78, '#0d061d', 'rgba(0, 229, 255, .60)', playerX * 66 + position * 0.009);

  // horizon line
  ctx.globalCompositeOperation = 'lighter';
  const hg = ctx.createLinearGradient(0, 0, W, 0);
  hg.addColorStop(0, 'rgba(255,45,149,0)');
  hg.addColorStop(0.5, 'rgba(255,150,215,.85)');
  hg.addColorStop(1, 'rgba(255,45,149,0)');
  ctx.fillStyle = hg;
  ctx.fillRect(0, H / 2 - 1, W, 2);
  ctx.globalCompositeOperation = 'source-over';
}

function drawRidge(ridge, baseY, amp, fill, rim, offset) {
  const n = ridge.length - 1;
  const step = W / n;
  const total = step * n;
  const off = ((offset % total) + total) % total;

  ctx.beginPath();
  ctx.moveTo(-step - off, baseY + 6);
  for (let i = 0; i <= n * 2; i++) {
    const x = i * step - off;
    ctx.lineTo(x, baseY - ridge[i % n] * amp);
    if (x > W + step) break;
  }
  ctx.lineTo(W + step, baseY + 6);
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.strokeStyle = rim;
  ctx.lineWidth = 1.2;
  ctx.stroke();
}

function renderSegment(seg) {
  const p1 = seg.p1.screen, p2 = seg.p2.screen;
  const y1 = p1.y, y2 = p2.y;
  if (y1 <= y2) return;
  const c = seg.color;

  // ground
  ctx.fillStyle = c.grass;
  ctx.fillRect(0, y2, W, y1 - y2 + 1);

  const r1 = Math.max(2, p1.w / 7), r2 = Math.max(1, p2.w / 7);

  // neon rumble strips (wide translucent pass = cheap bloom)
  ctx.globalCompositeOperation = 'lighter';
  poly(p1.x - p1.w - r1 * 2.1, y1, p1.x - p1.w, y1, p2.x - p2.w, y2, p2.x - p2.w - r2 * 2.1, y2, c.rumble + '33');
  poly(p1.x + p1.w + r1 * 2.1, y1, p1.x + p1.w, y1, p2.x + p2.w, y2, p2.x + p2.w + r2 * 2.1, y2, c.rumble + '33');
  ctx.globalCompositeOperation = 'source-over';

  poly(p1.x - p1.w - r1, y1, p1.x - p1.w, y1, p2.x - p2.w, y2, p2.x - p2.w - r2, y2, c.rumble);
  poly(p1.x + p1.w + r1, y1, p1.x + p1.w, y1, p2.x + p2.w, y2, p2.x + p2.w + r2, y2, c.rumble);

  // asphalt
  poly(p1.x - p1.w, y1, p1.x + p1.w, y1, p2.x + p2.w, y2, p2.x - p2.w, y2, c.road);

  // transverse light bars — the scrolling "speed grid" on the tarmac
  if (seg.index % 18 === 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.13;
    ctx.fillStyle = '#a8f0ff';
    ctx.fillRect(p1.x - p1.w, y1, p1.w * 2, Math.max(1, (y1 - y2) * 0.5));
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // lane paint
  if (c.lane) {
    const lw1 = (p1.w * 2) / LANES, lw2 = (p2.w * 2) / LANES;
    const m1 = Math.max(1, p1.w / 90), m2 = Math.max(0.5, p2.w / 90);
    let lx1 = p1.x - p1.w + lw1, lx2 = p2.x - p2.w + lw2;
    for (let l = 1; l < LANES; l++) {
      poly(lx1 - m1, y1, lx1 + m1, y1, lx2 + m2, y2, lx2 - m2, y2, c.lane);
      lx1 += lw1; lx2 += lw2;
    }
  }

  // atmospheric depth fade
  if (seg.fog < 1) {
    ctx.globalAlpha = 1 - seg.fog;
    ctx.fillStyle = HORIZON;
    ctx.fillRect(0, y2, W, y1 - y2 + 1);
    ctx.globalAlpha = 1;
  }
}

function drawTrafficCar(o, sx, baseY, hw) {
  const cw = Math.min(hw * 0.42, W * 0.23);
  if (cw < 2.2) return;
  const ch = cw * 0.70;

  ctx.save();
  ctx.translate(sx, baseY);

  // ground glow
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, cw * 0.8);
  g.addColorStop(0, 'rgba(140, 200, 255, .16)');
  g.addColorStop(1, 'rgba(140, 200, 255, 0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, cw * 0.8, cw * 0.24, 0, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  // body
  const bg = ctx.createLinearGradient(0, -ch, 0, 0);
  bg.addColorStop(0, o.light);
  bg.addColorStop(0.30, o.body);
  bg.addColorStop(1, '#0a0716');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(-cw / 2, -ch, cw, ch, cw * 0.16); ctx.fill();

  // cabin glass
  ctx.fillStyle = 'rgba(6, 12, 28, .9)';
  ctx.beginPath(); ctx.roundRect(-cw * 0.30, -ch * 0.82, cw * 0.60, ch * 0.28, cw * 0.08); ctx.fill();

  // roof highlight
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  ctx.beginPath(); ctx.roundRect(-cw * 0.34, -ch * 0.99, cw * 0.68, ch * 0.05, 2); ctx.fill();

  // headlights
  ctx.globalCompositeOperation = 'lighter';
  ctx.shadowColor = o.light;
  ctx.shadowBlur = Math.min(14, cw * 0.22);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.roundRect(-cw * 0.40, -ch * 0.17, cw * 0.18, ch * 0.09, 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cw * 0.22, -ch * 0.17, cw * 0.18, ch * 0.09, 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = 'source-over';

  ctx.restore();
}

function drawOrb(sx, baseY, hw, ph) {
  const r = Math.min(hw * 0.10, W * 0.028);
  if (r < 1.2) return;
  const cy = baseY - r * 1.3 - Math.sin(clock * 2.4 + ph) * r * 0.35;

  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(sx, cy, 0, sx, cy, r * 3);
  g.addColorStop(0, 'rgba(200,255,255,.95)');
  g.addColorStop(0.20, 'rgba(0,229,255,.55)');
  g.addColorStop(1, 'rgba(0,229,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(sx, cy, r * 3, 0, 7); ctx.fill();

  ctx.fillStyle = '#eafeff';
  ctx.beginPath(); ctx.arc(sx, cy, r * 0.58, 0, 7); ctx.fill();

  ctx.strokeStyle = 'rgba(143,245,255,.8)';
  ctx.lineWidth = Math.max(1, r * 0.15);
  ctx.beginPath();
  ctx.ellipse(sx, cy, r * 1.45, r * 0.5, Math.sin(clock * 1.6 + ph) * 0.5, 0, 7);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}

function render() {
  ctx.save();
  if (shake > 0.01) {
    const m = shake * 11;
    ctx.translate(rnd(-m, m), rnd(-m, m));
  }

  drawSky();

  const base = findSegment(position);
  const basePct = pctRemaining(position, SEG);
  const playerSeg = findSegment(position + PZ);
  const playerPct = pctRemaining(position + PZ, SEG);
  const playerY = lerp(playerSeg.p1.world.y, playerSeg.p2.world.y, playerPct);

  // bucket visible objects by segment index
  const buckets = new Map();
  for (const o of objects) {
    if (!o.active) continue;
    const rel = o.z - travel;
    if (rel < 0 || rel > DRAWD * SEG) continue;
    const idx = Math.floor((position + rel) / SEG) % segments.length;
    let arr = buckets.get(idx);
    if (!arr) buckets.set(idx, arr = []);
    arr.push(o);
  }

  const camY = playerY + CAMH;
  let maxy = H;
  let x = 0;
  let dx = -(base.curve * basePct);

  for (let n = 0; n < DRAWD; n++) {
    const seg = segments[(base.index + n) % segments.length];
    seg.looped = seg.index < base.index;
    seg.fog = expFog(n / DRAWD, FOGD);
    seg.clip = maxy;

    const camZ = position - (seg.looped ? trackLength : 0);
    project(seg.p1, playerX * ROADW - x, camY, camZ);
    project(seg.p2, playerX * ROADW - x - dx, camY, camZ);

    x += dx;
    dx += seg.curve;

    if (!seg.p1.screen.scale || seg.p1.camera.z <= CAMD) continue;
    if (seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;

    renderSegment(seg);
    maxy = seg.p2.screen.y;

    const list = buckets.get(seg.index);
    if (list) {
      const pct = clamp(((position + (list[0].z - travel)) % SEG) / SEG, 0, 1);
      for (const o of list) {
        const p = ((position + (o.z - travel)) % SEG) / SEG;
        const sc = lerp(seg.p1.screen.scale, seg.p2.screen.scale, p);
        const cx = lerp(seg.p1.screen.x, seg.p2.screen.x, p);
        const cy = lerp(seg.p1.screen.y, seg.p2.screen.y, p);
        const hw = sc * ROADW * W / 2;
        const sx = cx + o.offset * hw;
        // fade the sprite out as it sweeps past the camera so nothing
        // balloons into a screen-filling blob at point-blank range
        const rel = o.z - travel;
        ctx.globalAlpha = clamp((rel - 140) / 560, 0, 1);
        if (o.kind === 'car') drawTrafficCar(o, sx, cy, hw);
        else drawOrb(sx, cy, hw, o.ph);
        ctx.globalAlpha = 1;
      }
    }
  }

  drawSpeedLines();
  drawRoadSheen();
  drawPlayerCar();
  drawParticles();
  drawVignette();

  ctx.restore();
}

// wet-asphalt reflection: a soft purple bloom rising from the bottom of the road
function drawRoadSheen() {
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createLinearGradient(0, H * 0.52, 0, H);
  g.addColorStop(0, 'rgba(110, 60, 240, 0)');
  g.addColorStop(0.55, 'rgba(110, 60, 240, .035)');
  g.addColorStop(1, 'rgba(150, 50, 210, .07)');
  ctx.fillStyle = g;
  ctx.fillRect(0, H * 0.52, W, H * 0.48);
  ctx.globalCompositeOperation = 'source-over';
}

function drawSpeedLines() {
  if (state !== 'play') return;
  const intensity = clamp((speed / MAXSPEED - 0.55) / 0.45, 0, 1);
  if (intensity <= 0) return;
  ctx.globalCompositeOperation = 'lighter';
  const cx = W / 2, cy = H * 0.52;
  for (const s of STREAKS) {
    const r0 = (s.r + clock * s.sp * 0.55) % 1;
    const r1 = Math.min(1, r0 + s.len * (0.4 + intensity));
    const x0 = cx + Math.cos(s.a) * r0 * W * 0.78;
    const y0 = cy + Math.sin(s.a) * r0 * H * 0.9;
    const x1 = cx + Math.cos(s.a) * r1 * W * 0.78;
    const y1 = cy + Math.sin(s.a) * r1 * H * 0.9;
    const a = intensity * Math.sin(r0 * Math.PI) * 0.5;
    ctx.strokeStyle = `rgba(160,240,255,${a})`;
    ctx.lineWidth = s.w;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawPlayerCar() {
  const s = W / 960;
  const cx = W / 2 + lean * 26 * s;
  const bounce = Math.sin(bob) * 1.5 * s + Math.sin(bob * 2.3) * 0.7 * s;
  const cy = H * 0.915 + bounce;

  const CW = 286 * s, CH = 120 * s;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(lean * 0.035);
  if (invuln > 0 && Math.floor(clock * 14) % 2 === 0) ctx.globalAlpha = 0.4;

  /* --- road reflection under the car --- */
  ctx.globalCompositeOperation = 'lighter';
  const refl = ctx.createLinearGradient(0, 0, 0, CH * 0.85);
  refl.addColorStop(0, 'rgba(255, 45, 149, .30)');
  refl.addColorStop(0.45, 'rgba(255, 45, 149, .10)');
  refl.addColorStop(1, 'rgba(0, 229, 255, 0)');
  ctx.fillStyle = refl;
  ctx.fillRect(-CW * 0.40, 0, CW * 0.80, CH * 0.85);

  /* --- underglow --- */
  const ug = ctx.createRadialGradient(0, 4 * s, 0, 0, 4 * s, CW * 0.55);
  ug.addColorStop(0, 'rgba(0, 229, 255, .38)');
  ug.addColorStop(0.45, 'rgba(123, 92, 255, .12)');
  ug.addColorStop(1, 'rgba(0, 229, 255, 0)');
  ctx.fillStyle = ug;
  ctx.beginPath(); ctx.ellipse(0, 4 * s, CW * 0.55, CW * 0.17, 0, 0, 7); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  /* --- contact shadow --- */
  ctx.fillStyle = 'rgba(0, 0, 0, .62)';
  ctx.beginPath(); ctx.ellipse(0, 2 * s, CW * 0.46, CH * 0.085, 0, 0, 7); ctx.fill();

  /* --- wheels tucked under the haunches --- */
  ctx.fillStyle = '#06040e';
  ctx.beginPath(); ctx.roundRect(-CW * 0.545, -CH * 0.32, CW * 0.135, CH * 0.34, 6 * s); ctx.fill();
  ctx.beginPath(); ctx.roundRect(CW * 0.410, -CH * 0.32, CW * 0.135, CH * 0.34, 6 * s); ctx.fill();
  ctx.fillStyle = 'rgba(143, 245, 255, .22)';
  ctx.beginPath(); ctx.roundRect(-CW * 0.545, -CH * 0.32, CW * 0.135, CH * 0.04, 2 * s); ctx.fill();
  ctx.beginPath(); ctx.roundRect(CW * 0.410, -CH * 0.32, CW * 0.135, CH * 0.04, 2 * s); ctx.fill();

  /* --- rear wing --- */
  ctx.fillStyle = '#100b22';
  ctx.beginPath(); ctx.roundRect(-CW * 0.62, -CH * 1.02, CW * 1.24, CH * 0.075, 3 * s); ctx.fill();
  ctx.fillStyle = '#2b2058';
  ctx.beginPath(); ctx.roundRect(-CW * 0.62, -CH * 1.055, CW * 1.24, CH * 0.045, 2 * s); ctx.fill();
  // endplates
  ctx.fillStyle = '#3d2c78';
  ctx.beginPath(); ctx.roundRect(-CW * 0.635, -CH * 1.06, CW * 0.045, CH * 0.15, 2 * s); ctx.fill();
  ctx.beginPath(); ctx.roundRect(CW * 0.590, -CH * 1.06, CW * 0.045, CH * 0.15, 2 * s); ctx.fill();
  // struts
  ctx.fillStyle = '#1a1338';
  ctx.beginPath(); ctx.roundRect(-CW * 0.26, -CH * 0.95, CW * 0.045, CH * 0.18, 2 * s); ctx.fill();
  ctx.beginPath(); ctx.roundRect(CW * 0.215, -CH * 0.95, CW * 0.045, CH * 0.18, 2 * s); ctx.fill();

  /* --- body --- */
  const bg = ctx.createLinearGradient(0, -CH * 0.85, 0, CH * 0.02);
  bg.addColorStop(0, '#6a4ae0');
  bg.addColorStop(0.22, '#3d2985');
  bg.addColorStop(0.52, '#221a5c');
  bg.addColorStop(0.82, '#120e30');
  bg.addColorStop(1, '#080516');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(-CW * 0.44, -CH * 0.805);
  ctx.lineTo(CW * 0.44, -CH * 0.805);
  ctx.lineTo(CW * 0.545, -CH * 0.50);
  ctx.lineTo(CW * 0.535, -CH * 0.06);
  ctx.lineTo(CW * 0.46, -CH * 0.005);
  ctx.lineTo(-CW * 0.46, -CH * 0.005);
  ctx.lineTo(-CW * 0.535, -CH * 0.06);
  ctx.lineTo(-CW * 0.545, -CH * 0.50);
  ctx.closePath();
  ctx.fill();

  /* --- shoulder rim light --- */
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(143, 245, 255, .55)';
  ctx.lineWidth = 1.8 * s;
  ctx.beginPath();
  ctx.moveTo(-CW * 0.44, -CH * 0.80);
  ctx.lineTo(-CW * 0.545, -CH * 0.50);
  ctx.lineTo(-CW * 0.535, -CH * 0.10);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(CW * 0.44, -CH * 0.80);
  ctx.lineTo(CW * 0.545, -CH * 0.50);
  ctx.lineTo(CW * 0.535, -CH * 0.10);
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';

  /* --- rear glass --- */
  const wg = ctx.createLinearGradient(0, -CH * 0.76, 0, -CH * 0.46);
  wg.addColorStop(0, 'rgba(150, 220, 255, .38)');
  wg.addColorStop(1, 'rgba(8, 12, 34, .95)');
  ctx.fillStyle = wg;
  ctx.beginPath();
  ctx.moveTo(-CW * 0.335, -CH * 0.755);
  ctx.lineTo(CW * 0.335, -CH * 0.755);
  ctx.lineTo(CW * 0.285, -CH * 0.475);
  ctx.lineTo(-CW * 0.285, -CH * 0.475);
  ctx.closePath();
  ctx.fill();

  /* --- engine vents --- */
  ctx.fillStyle = 'rgba(6, 8, 20, .9)';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.roundRect(-CW * 0.14 + i * CW * 0.10, -CH * 0.45, CW * 0.055, CH * 0.10, 2 * s);
    ctx.fill();
  }

  /* --- diffuser --- */
  ctx.fillStyle = '#05030c';
  ctx.beginPath(); ctx.roundRect(-CW * 0.34, -CH * 0.095, CW * 0.68, CH * 0.09, 3 * s); ctx.fill();

  /* --- tail light bar --- */
  ctx.globalCompositeOperation = 'lighter';
  ctx.shadowColor = '#ff2d95';
  ctx.shadowBlur = 34 * s;
  const lg = ctx.createLinearGradient(-CW * 0.44, 0, CW * 0.44, 0);
  lg.addColorStop(0, '#ff2d95');
  lg.addColorStop(0.5, '#ffb3dd');
  lg.addColorStop(1, '#ff2d95');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.roundRect(-CW * 0.42, -CH * 0.375, CW * 0.84, CH * 0.08, 4 * s); ctx.fill();

  ctx.fillStyle = '#ff2d95';
  ctx.beginPath(); ctx.roundRect(-CW * 0.50, -CH * 0.285, CW * 0.075, CH * 0.045, 2 * s); ctx.fill();
  ctx.beginPath(); ctx.roundRect(CW * 0.425, -CH * 0.285, CW * 0.075, CH * 0.045, 2 * s); ctx.fill();
  ctx.shadowBlur = 0;

  /* --- exhausts --- */
  ctx.fillStyle = '#1b1533';
  ctx.beginPath(); ctx.roundRect(-CW * 0.235, -CH * 0.075, CW * 0.11, CH * 0.055, 2 * s); ctx.fill();
  ctx.beginPath(); ctx.roundRect(CW * 0.125, -CH * 0.075, CW * 0.11, CH * 0.055, 2 * s); ctx.fill();

  /* --- boost flames --- */
  if (state === 'play' && (keys.up || keys.space) && boost > 0.02) {
    for (const ex of [-CW * 0.18, CW * 0.18]) {
      const flick = 0.82 + Math.random() * 0.4;
      const flame = ctx.createLinearGradient(0, 0, 0, CH * 0.62);
      flame.addColorStop(0, 'rgba(220, 255, 255, .98)');
      flame.addColorStop(0.28, 'rgba(0, 229, 255, .78)');
      flame.addColorStop(0.66, 'rgba(123, 92, 255, .45)');
      flame.addColorStop(1, 'rgba(255, 45, 149, 0)');
      ctx.fillStyle = flame;
      ctx.beginPath();
      ctx.moveTo(ex - CW * 0.05, -CH * 0.06);
      ctx.lineTo(ex + CW * 0.05, -CH * 0.06);
      ctx.lineTo(ex, CH * 0.50 * flick);
      ctx.closePath();
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';

  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawParticles() {
  if (!particles.length) return;
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

const vignette = (() => {
  const g = ctx.createRadialGradient(W / 2, H * 0.55, H * 0.28, W / 2, H * 0.55, H * 0.95);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(0.65, 'rgba(0,0,0,.12)');
  g.addColorStop(1, 'rgba(0,0,0,.62)');
  return g;
})();
function drawVignette() {
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
  // scanlines
  ctx.globalAlpha = 0.05;
  ctx.fillStyle = '#8ff5ff';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
  ctx.globalAlpha = 1;
}

/* ---------------- loop ---------------- */
function frame(t) {
  if (!lastT) lastT = t;
  const dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ---------------- flow ---------------- */
function startGame() {
  resetGame();
  state = 'play';
  $('panel').hidden = true;
  $('hint').textContent = 'Steer with A / D or the arrow keys. Hold ↑ or Space to burn boost. Collect orbs to refill it.';
}
function gameOver() {
  state = 'over';
  const final = Math.floor(score);
  const record = Best.save('neon-drift', final);
  $('bestTop').textContent = Best.get('neon-drift').toLocaleString('en-US');
  const p = $('panel');
  p.hidden = false;
  p.innerHTML = `
    <h2 class="result">WIPEOUT</h2>
    <p class="scoreline">DISTANCE SCORE <b>${final.toLocaleString('en-US')}</b></p>
    <p class="scoreline" style="font-size:13px;letter-spacing:3px;color:#7f6ba8">BEST ${Best.get('neon-drift').toLocaleString('en-US')}</p>
    ${record ? '<div class="newbest">NEW RECORD</div>' : ''}
    <button class="cta" id="pBtn">DRIVE AGAIN</button>`;
  $('pBtn').onclick = startGame;
  burst(W / 2, H * 0.8, 60, ['#ff2d95', '#ff9d00', '#00e5ff'], 1.6);
}

/* ---------------- input ---------------- */
const KEYMAP = {
  ArrowLeft: 'left', a: 'left', A: 'left',
  ArrowRight: 'right', d: 'right', D: 'right',
  ArrowUp: 'up', w: 'up', W: 'up',
  ArrowDown: 'down', s: 'down', S: 'down',
  ' ': 'space',
};
addEventListener('keydown', e => {
  const k = KEYMAP[e.key];
  if (k) { keys[k] = true; e.preventDefault(); }
  if (e.key === 'Enter' && state !== 'play') startGame();
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.key];
  if (k) { keys[k] = false; e.preventDefault(); }
});

// pointer steering: hold on the left/right half of the screen
let pointerDown = false;
function pointerSteer(e) {
  const r = cvs.getBoundingClientRect();
  const rx = (e.clientX - r.left) / r.width;
  touchSteer = rx < 0.5 ? -1 : 1;
}
cvs.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  pointerDown = true;
  cvs.setPointerCapture(e.pointerId);
  pointerSteer(e);
});
cvs.addEventListener('pointermove', e => { if (pointerDown) pointerSteer(e); });
cvs.addEventListener('pointerup', () => { pointerDown = false; touchSteer = 0; });
cvs.addEventListener('pointercancel', () => { pointerDown = false; touchSteer = 0; });

/* ---------------- boot ---------------- */
buildTrack();
resetGame();
updatePips();
$('bestTop').textContent = Best.get('neon-drift').toLocaleString('en-US');
$('pBtn').onclick = startGame;
requestAnimationFrame(frame);
</script>
</body>
</html>
