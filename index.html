<title>Meadow Arcade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Layout: title band, filter row, then a wrapping grid of cabinet-style game cards. One dusk-meadow look shared with every game. */
  :root {
    --bg: #10231f;
    --panel: #183530;
    --line: #2a4b44;
    --fg: #eef3e6;
    --muted: #9fb8ad;
    --gold: #f2b544;
    --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; margin: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 40px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  .hero { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(40px, 8vw, 64px); line-height: .95; margin: 0; color: var(--gold); letter-spacing: 1px; text-wrap: balance; }
  .hero p { margin: 6px 0 0; color: var(--muted); font-size: 17px; max-width: 46ch; }
  .count { font-family: var(--display); font-size: 18px; color: var(--muted); }
  .count b { color: var(--fg); font-weight: 400; font-size: 28px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { font: inherit; font-weight: 800; color: var(--fg); background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #2b1d00; }
  .chip:focus-visible, .card:focus-visible, #search:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  #search { margin-left: auto; font: inherit; color: var(--fg); background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; width: 220px; max-width: 100%; }
  #search::placeholder { color: var(--muted); }
  @media (max-width: 560px) { #search { margin-left: 0; width: 100%; } }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .card { display: flex; flex-direction: column; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; overflow: hidden; color: inherit; text-decoration: none; transition: transform .15s, border-color .15s; }
  .card:hover { transform: translateY(-3px); border-color: var(--gold); }
  .card svg { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; }
  .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .name { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .name h2 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; }
  .tag { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 800; color: var(--muted); }
  .desc { margin: 0; color: var(--muted); line-height: 1.4; flex: 1; }
  .best { font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--gold); }
  .best.none { color: var(--muted); font-weight: 600; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>

<div class="wrap">
  <section class="hero">
    <div>
      <h1>Meadow Arcade</h1>
      <p>Pick a game and play right in your browser. Your best scores are saved on this device.</p>
    </div>
    <div class="count"><b id="count">21</b> games</div>
  </section>

  <div class="filters" id="filters">
    <button class="chip" data-tag="All" aria-pressed="true">All</button>
    <button class="chip" data-tag="Action" aria-pressed="false">Action</button>
    <button class="chip" data-tag="Puzzle" aria-pressed="false">Puzzle</button>
    <button class="chip" data-tag="Strategy" aria-pressed="false">Strategy</button>
    <button class="chip" data-tag="Memory" aria-pressed="false">Memory</button>
    <button class="chip" data-tag="Word" aria-pressed="false">Word</button>
    <button class="chip" data-tag="Cards" aria-pressed="false">Cards</button>
    <button class="chip" data-tag="Sports" aria-pressed="false">Sports</button>
    <input id="search" type="search" placeholder="Search games" aria-label="Search games">
  </div>

  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No games match that search.</p>
</div>

    art: `<rect width="160" height="100" fill="#6b4a32"/><rect x="6" y="6" width="148" height="88" fill="#4f9a58"/><rect x="60" y="44" width="50" height="8" fill="#6b4a32"/><rect x="18" y="62" width="40" height="22" rx="8" fill="#3d8fd1"/><circle cx="120" cy="24" r="5" fill="#1a2a1d"/><rect x="120" y="4" width="1.5" height="20" fill="#eef3e6"/><path d="M121.5 4 l12 4 -12 4z" fill="#ef6f6c"/><circle cx="84" cy="80" r="4" fill="#fff"/>${[1, 2, 3, 4].map(i => `<circle cx="${84 + i * 6}" cy="${80 - i * 9}" r="1.5" fill="#fff" opacity="${1 - i * .2}"/>`).join('')}` },
  { id: 'solitaire', name: 'Solitaire', tag: 'Cards', desc: 'The classic patience game. Sort the deck into four suits from Ace to King.', best: ['solitaire', 'Wins: '],
    art: `<rect width="160" height="100" fill="#1d4a3a"/><g transform="rotate(-14 70 60)"><rect x="46" y="22" width="36" height="50" rx="4" fill="#fbf7ec"/><text x="51" y="35" font-size="11" font-weight="800" fill="#1d1d1d">K♠</text></g><g><rect x="62" y="20" width="36" height="50" rx="4" fill="#fbf7ec"/><text x="67" y="33" font-size="11" font-weight="800" fill="#c0392b">Q♥</text><text x="80" y="60" font-size="18" fill="#c0392b">♥</text></g><g transform="rotate(14 90 60)"><rect x="78" y="22" width="36" height="50" rx="4" fill="#fbf7ec"/><text x="83" y="35" font-size="11" font-weight="800" fill="#1d1d1d">A♣</text></g>` },
];

function readBest(key) { try { return Number(localStorage.getItem('best:' + key)) || 0; } catch { return 0; } }

const grid = document.getElementById('grid');
grid.innerHTML = GAMES.map(g => {
  const [key, label, unit = '', ] = g.best, v = readBest(key);
  return `<a class="card" href="games/${g.id}.html" data-tag="${g.tag}" data-name="${g.name.toLowerCase()} ${g.tag.toLowerCase()}">
    <svg viewBox="0 0 160 100" role="img" aria-label="${g.name} preview">${g.art}</svg>
    <div class="body">
      <div class="name"><h2>${g.name}</h2><span class="tag">${g.tag}</span></div>
      <p class="desc">${g.desc}</p>
      <span class="best${v ? '' : ' none'}">${v ? label + v + unit : 'Not played yet'}</span>
    </div>
  </a>`;
}).join('');

let tag = 'All';
function filter() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  let shown = 0;
  for (const c of grid.children) {
    const ok = (tag === 'All' || c.dataset.tag === tag) && c.dataset.name.includes(q);
    c.hidden = !ok; shown += ok;
  }
  document.getElementById('count').textContent = shown;
  document.getElementById('empty').hidden = shown > 0;
}
document.querySelectorAll('.chip').forEach(b => b.onclick = () => {
  tag = b.dataset.tag;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
  filter();
});
document.getElementById('search').oninput = filter;
document.getElementById('count').textContent = GAMES.length;
</script>
